:root{
  --bg:#faf7f4; --surface:#ffffff; --surface-2:#f2ece7; --line:#e6ddd5;
  --text:#241f1c; --muted:#8b7f76; --accent:#c1785c; --accent-soft:#f6e7df;
  --danger:#c0483f; --ok:#4f8a5b; --warn:#d08a8a;
  --font-ui:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(36,31,28,.06),0 6px 18px rgba(36,31,28,.07);
  --tabh:58px; --toph:52px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--surface-2);color:var(--text);
  font:15px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}

#app{
  max-width:480px;margin:0 auto;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 40px rgba(36,31,28,.12);overflow:hidden;
  isolation:isolate;   /* модалки должны перекрывать FAB и таббар */
}

/* ---------- topbar ---------- */
#topbar{
  height:var(--toph);flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:20;
}
#tb-title{
  font-family:var(--font-display);font-size:23px;font-weight:600;
  margin:0;flex:1;min-width:0;text-align:center;letter-spacing:.01em;
  /* длинное название не должно разъезжаться на две строки поверх кнопок */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-left,.tb-right{min-width:76px;display:flex;gap:4px;align-items:center}
.tb-right{justify-content:flex-end}
.icon-btn{
  background:none;border:0;padding:6px 8px;border-radius:10px;font-size:19px;line-height:1;
}
.icon-btn:hover{background:var(--surface-2)}
#tb-back{font-size:26px;font-weight:300}

/* ---------- views ---------- */
main#views{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding:12px 12px 90px}

/* ---------- tabbar ---------- */
#tabbar{
  height:var(--tabh);flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);z-index:20;
}
#tabbar button{
  background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10px;color:var(--muted);padding:0;
}
#tabbar button .ic{font-size:19px;filter:grayscale(1) opacity(.65)}
#tabbar button.active{color:var(--accent);font-weight:600}
#tabbar button.active .ic{filter:none}

/* ---------- generic ---------- */
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.hidden{display:none !important}

.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:550;white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:#eccfcc}
.btn.block{width:100%;justify-content:center;text-align:center;border-radius:var(--r)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-sm{padding:5px 10px;font-size:12px}

.fab{
  position:absolute;right:14px;bottom:calc(var(--tabh) + 14px);z-index:30;
  width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;
  font-size:28px;line-height:1;box-shadow:0 6px 20px rgba(193,120,92,.45);
}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 12px;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .cnt{opacity:.6;font-size:11px}
.chip.active .cnt{opacity:.85}

.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 2px 8px;font-weight:700}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- grids ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.tile{
  position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--surface);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
}
.tile img{width:100%;height:100%;object-fit:contain;padding:6px}
.tile .lbl{
  position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;
  color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tile .fav{position:absolute;top:5px;right:6px;font-size:13px}
.tile .check{
  position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
}
.tile .check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tile .badge{position:absolute;top:5px;left:5px;background:rgba(255,255,255,.9);border-radius:6px;font-size:10px;padding:1px 5px}

/* карточка вещи — отдельный экран: фото во всю ширину, действия под ним */
.card-photo{
  width:100%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px
}
.card-photo img{width:100%;height:100%;object-fit:contain;padding:10px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.card-actions .btn{flex:1}
/* поля карточки: подробности под кнопкой «Подробнее» */
.lrow .worn{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center}
.btn.more{margin-top:10px;color:var(--muted);font-weight:600}
.card-details{margin-top:8px}
.detail{
  display:flex;gap:10px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--line);
}
.detail:last-child{border-bottom:0}
.detail .k{flex:0 0 96px;font-size:12px;color:var(--muted);font-weight:600}
.detail .v{flex:1;min-width:0;font-size:14px;word-break:break-word}
.detail .v.chips{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}

/* значение, выбираемое из общего списка */
.btn.pick{justify-content:flex-start;text-align:left;font-weight:500}
.lrow.on{border-color:var(--accent)}
.lrow .tick{color:var(--accent);font-weight:700}

/* строка состава: материал, проценты, «убрать» */
.part-row{gap:6px;margin-bottom:6px}
.part-row .pct{width:66px;flex:0 0 auto;text-align:center}
/* второй путь в выборе: доступен, но не бросается в глаза */
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-size:13px;font-weight:500}
/* цвет, которого ещё нет ни на одной вещи, и «без цвета» */
.swatch.unused{opacity:.4}
.swatch.none{background:var(--surface);border:1px dashed var(--muted);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:14px}
.chip.add{border-style:dashed;color:var(--muted)}
/* строка фильтров: все поля выглядят одинаково, выбранное написано в чипе */
.chips.filters{padding:6px 0 2px;flex-wrap:wrap;overflow:visible}
.chips.filters .chip{white-space:nowrap}
.chip .x{margin-left:4px;opacity:.7;font-size:11px}

/* образы: вещь, ушедшая в архив, видна и в карточке, и на плитке */
.card-photo.tall{aspect-ratio:3/4}
.warn-line{
  margin:8px 0 0;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--muted);font-size:12.5px;line-height:1.45;
  border-left:3px solid var(--warn);
}
.tile.gone img{opacity:.45;filter:grayscale(.7)}
.tile .gone-mark{
  position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15)
}
/* строка списка с архивной вещью — в чемодане */
.lrow.gone{border-color:var(--warn)}
.lrow.gone .thumb{opacity:.5;filter:grayscale(.6)}
.lrow.gone .t span{color:var(--warn)}

/* образ с архивной вещью виден издалека: рамка, а не только значок */
.tile.has-gone{outline:2px solid var(--warn);outline-offset:-2px}
.tile.has-gone .gone-mark{background:var(--warn);color:#fff;box-shadow:none}
/* превью в форме вещи — кнопка: по нему меняют фотографию */
.tile.pick-photo{cursor:pointer}
.tile.pick-photo::after{
  content:'\270E';position:absolute;right:6px;bottom:6px;
  width:26px;height:26px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:13px;
  background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)
}
input[type=color].hex{width:100%;height:42px;padding:2px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}
.row .cur{width:58px;flex:0 0 auto;text-align:center}


/* ---------- color dots ---------- */
.dots{display:flex;gap:3px}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.swatch{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(28,22,18,.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.4}}
.modal{
  width:100%;max-width:480px;background:var(--bg);border-radius:18px 18px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;animation:up .18s ease;
}
.modal.full{height:100dvh;max-height:100dvh;border-radius:0}
.modal-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.modal-head h2{font-family:var(--font-display);font-size:21px;margin:0;flex:1;font-weight:600}
.modal-body{padding:12px;overflow:auto;flex:1 1 auto}
.modal-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex:0 0 auto;background:var(--bg)}
.modal-foot .btn{flex:1}

label.field{display:block;margin-bottom:12px}
label.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font:inherit;color:inherit;
}
input[type=range]{width:100%;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{
  display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
}
.lrow .thumb{width:44px;height:52px;object-fit:contain;background:var(--surface-2);border-radius:8px;flex:0 0 auto}
.lrow .t{flex:1;min-width:0}
.lrow .t b{
  display:block;font-size:15px;font-weight:600;font-family:var(--font-display);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lrow .t span{font-size:12px;color:var(--muted)}

/* строка-переход в раздел гардероба */
.lrow.nav{cursor:pointer}
.lrow.nav:hover{border-color:var(--accent)}
.lrow .thumb.ph{
  display:flex;align-items:center;justify-content:center;font-size:22px;
  width:44px;height:52px;background:var(--surface-2);border-radius:8px;flex:0 0 auto;
}
.lrow .chev{color:var(--muted);font-size:22px;line-height:1;padding-right:2px}
.lrow .chev.back{padding:0 4px 0 0}
/* стрелки порядка категорий */
.lrow .ord{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.lrow .ord .btn{padding:1px 7px;font-size:12px;line-height:1.3;min-width:0}
.lrow .ord .btn[disabled]{opacity:.25}
/* мозаика из четырёх последних вещей — миниатюра раздела «Все вещи» */
.lrow .thumb.grid4{
  display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1px;
  background:var(--surface-2);overflow:hidden;padding:0;
}
.lrow .thumb.grid4 img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
/* «Другое» — не настоящая подкатегория: приглушена и без действий */
.lrow.nav.soft{background:transparent;border-style:dashed}
.lrow.nav.soft .t b{font-weight:500;color:var(--muted)}

/* ---------- editor ---------- */
#ed-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:repeating-conic-gradient(#e9e3dd 0 25%, #f7f3ef 0 50%) 0 0/16px 16px;
  position:relative;touch-action:none;
}
#ed-canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;transform-origin:center center}
/* масштаб — поверх снимка: в строке инструментов для него нет места,
   а нужен он одновременно с ними */
.zoom-bar{
  position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;
  padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:12px
}
.zoom-bar b{min-width:40px;text-align:center;color:var(--muted);font-weight:600}
.zoom-bar .zb{
  width:28px;height:28px;border:0;background:transparent;border-radius:8px;
  font-size:15px;line-height:1;color:var(--ink);cursor:pointer
}
.zoom-bar .zb.wide{width:34px;font-size:11px}
.zoom-bar .zb:active{background:var(--surface-2)}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{
  border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 10px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;
}
.tool .ic{font-size:17px}
.tool.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tool-opts{padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);font-size:12px}

/* ---------- outfit editor ---------- */
#stage-host{background:var(--surface-2);flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.palette-row{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.palette-row::-webkit-scrollbar{display:none}

/* ---------- calendar ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-head div{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
  aspect-ratio:.78;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  position:relative;overflow:hidden;padding:2px;display:flex;flex-direction:column;
}
.cal-cell.out{opacity:.35}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .d{font-size:10px;color:var(--muted);text-align:right;padding:0 2px;flex:0 0 auto}
.cal-cell .pv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cal-cell .pv img{max-width:100%;max-height:100%;object-fit:contain}
.cal-cell .n{position:absolute;left:3px;top:2px;font-size:9px;background:var(--accent);color:#fff;border-radius:5px;padding:0 4px}

/* ---------- misc ---------- */
#busy{position:fixed;inset:0;background:rgba(250,247,244,.82);z-index:300;display:flex;align-items:center;justify-content:center}
.busy-box{text-align:center;color:var(--muted);font-size:13px}
.spinner{
  width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg)}}

#toast-root{position:fixed;bottom:calc(var(--tabh) + 20px);left:0;right:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#241f1c;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow)}

.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700}
.stat span{font-size:11px;color:var(--muted)}

video#cam{width:100%;border-radius:var(--r);background:#000}

#busy[hidden]{display:none !important}

/* ---------- чемодан ---------- */
.sticky-add{
  position:sticky;top:0;z-index:5;background:var(--bg);
  margin:-12px -12px 10px;padding:10px 12px 8px;border-bottom:1px solid var(--line);
}
.sticky-add .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.sticky-add .meta .section-title{margin:0}
.trip-progress{font-size:12px;color:var(--muted);white-space:nowrap}
.archive-bar{
  position:absolute;left:0;right:0;bottom:var(--tabh);z-index:25;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;
}
.archive-bar b{font-weight:600}

/* закреплённые внизу рабочие полки гардероба: «Сортировка», «На рассмотрении», архив */
.pinned-bottom{
  position:absolute;left:0;right:0;bottom:var(--tabh);z-index:25;
  background:var(--surface);border-top:1px solid var(--line);
}
.pinned-bottom:empty{display:none}
.service-bar{
  height:42px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13px;
  border-top:1px solid var(--line);cursor:pointer;
}
.service-bar:first-child{border-top:0}
.service-bar:hover{background:var(--bg)}
.service-bar b{font-weight:600}

/* полоска действий над выделенными вещами — на месте архивной */
.select-bar{
  position:absolute;left:0;right:0;bottom:var(--tabh);z-index:25;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px;display:flex;align-items:center;gap:8px;
}
.fab.raised{bottom:calc(var(--tabh) + 70px)}

/* кнопки добавления выделены цветом — это главное действие в поездке */
.sticky-add .meta .section-title{color:var(--accent)}
.btn-add{
  background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:650;
}
.btn-add:hover{border-color:var(--accent)}

</style>

<script type="module">
/* ===== db.js ===== */
// Минимальная обёртка над IndexedDB. Картинки храним как Blob — localStorage не подходит.
const DB_NAME = 'yourcloset';
const DB_VER = 1;
const STORES = ['items', 'outfits', 'collections', 'cats', 'calendar', 'trips', 'meta'];

let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const s of STORES) {
        if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}

function tx(store, mode) {
  return openDB().then(db => db.transaction(store, mode).objectStore(store));
}
function wrap(request) {
  return new Promise((res, rej) => {
    request.onsuccess = () => res(request.result);
    request.onerror = () => rej(request.error);
  });
}

const dbAll = s => tx(s, 'readonly').then(o => wrap(o.getAll()));
const dbGet = (s, id) => tx(s, 'readonly').then(o => wrap(o.get(id)));
const dbPut = (s, v) => tx(s, 'readwrite').then(o => wrap(o.put(v))).then(() => v);
const dbDel = (s, id) => tx(s, 'readwrite').then(o => wrap(o.delete(id)));
const dbClear = s => tx(s, 'readwrite').then(o => wrap(o.clear()));

function uid(prefix = 'i') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ===== ui.js ===== */
// DOM-хелперы, модалки, тосты, индикатор занятости.

const qs = (sel, root = document) => root.querySelector(sel);
const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(3)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

/* ---- blob URL кэш ---- */
const urlCache = new WeakMap();
function urlFor(blob) {
  if (!blob) return '';
  if (typeof blob === 'string') return blob;
  let u = urlCache.get(blob);
  if (!u) { u = URL.createObjectURL(blob); urlCache.set(blob, u); }
  return u;
}

/* ---- тосты ---- */
function toast(msg, ms = 2000) {
  const t = h('div', { class: 'toast' }, msg);
  qs('#toast-root').append(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; }, ms - 250);
  setTimeout(() => t.remove(), ms);
}

/* ---- busy ---- */
function busy(on, text = 'Обработка…') {
  const b = qs('#busy');
  qs('#busy-text').textContent = text;
  b.hidden = !on;
}

/* ---- модальные окна ---- */
function openModal({ title, body, foot, full = false, onClose, closeText = '✕', headAction }) {
  const bodyEl = h('div', { class: 'modal-body' }, body || '');
  const modal = h('div', { class: 'modal' + (full ? ' full' : '') },
    h('div', { class: 'modal-head' },
      h('h2', {}, title || ''),
      headAction || null,
      h('button', { class: 'icon-btn', onclick: () => close() }, closeText)
    ),
    bodyEl,
    foot && foot.length ? h('div', { class: 'modal-foot' }, foot) : null
  );
  const back = h('div', { class: 'modal-back' }, modal);
  back.addEventListener('mousedown', e => { if (e.target === back && !full) close(); });
  qs('#modal-root').append(back);

  function close() {
    back.remove();
    if (onClose) onClose();
  }
  return { close, root: modal, body: bodyEl };
}

function confirmDialog(text, okText = 'Удалить') {
  return new Promise(res => {
    let answered = false;
    const answer = v => { answered = true; res(v); m.close(); };
    const m = openModal({
      title: 'Подтверждение',
      body: h('p', { style: { margin: '4px 0 8px' } }, text),
      foot: [
        h('button', { class: 'btn', onclick: () => answer(false) }, 'Отмена'),
        h('button', { class: 'btn primary', onclick: () => answer(true) }, okText)
      ],
      onClose: () => { if (!answered) res(false); }
    });
  });
}

/**
 * allowEmpty — когда пустое значение осмысленно (например, у образа можно
 * убрать название). Без него пустая строка неотличима от отмены.
 */
function promptDialog(title, value = '', label = 'Название', allowEmpty = false) {
  return new Promise(res => {
    const input = h('input', { type: 'text', value });
    let answered = false;
    const answer = v => { answered = true; res(v); m.close(); };
    const m = openModal({
      title,
      body: h('label', { class: 'field' }, h('span', {}, label), input),
      foot: [
        h('button', { class: 'btn', onclick: () => answer(null) }, 'Отмена'),
        h('button', {
          class: 'btn primary',
          onclick: () => answer(allowEmpty ? input.value.trim() : input.value.trim() || null)
        }, 'ОК')
      ],
      onClose: () => { if (!answered) res(null); }
    });
    setTimeout(() => input.focus(), 60);
  });
}

/* ---- выбор из списка действий ---- */
function actionSheet(title, actions) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title,
      body: h('div', { class: 'list' },
        actions.map(a => h('button', {
          class: 'btn block' + (a.danger ? ' danger' : '') + (a.muted ? ' quiet' : ''),
          style: { textAlign: 'left', marginBottom: '2px' },
          onclick: () => { done = true; res(a.id); m.close(); }
        }, (a.icon ? a.icon + '  ' : '') + a.label))
      ),
      onClose: () => { if (!done) res(null); }
    });
  });
}

/** Сообщение без выбора — когда действие не выполнено и надо объяснить почему. */
function alertDialog(text, title = 'Так нельзя') {
  return new Promise(res => {
    let answered = false;
    const m = openModal({
      title,
      body: h('p', { style: { margin: '4px 0 8px' } }, text),
      foot: [h('button', { class: 'btn primary', onclick: () => { answered = true; res(); m.close(); } }, 'Понятно')],
      onClose: () => { if (!answered) res(); }
    });
  });
}

const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many);
};
const nItems = n => plural(n, 'вещь', 'вещи', 'вещей');
const nOutfits = n => plural(n, 'образ', 'образа', 'образов');
/** Только слово, без числа — для подписей под крупной цифрой. */
const pluralWord = (n, one, few, many) =>
  plural(n, one, few, many).split(' ').slice(1).join(' ');

const fmtDate = d => {
  const dt = typeof d === 'string' ? new Date(d + 'T00:00:00') : d;
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
};
const iso = d => {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

/** replaceChildren, но с отбрасыванием null/false — иначе в DOM попадает текст "null". */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(3).filter(k => k != null && k !== false));
  return el;
}

/* ===== color.js ===== */
// Работа с цветом: извлечение оттенков с фотографии и сравнение в OKLab.
// Названий цветов здесь нет — их даёт пользователь в своей палитре.

const hexToRgb = hex => {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgbToHex = (r, g, b) =>
  '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

// sRGB -> OKLab (перцептивно равномерное пространство; сравнивать цвета в RGB нельзя)
function oklab(r, g, b) {
  const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const R = f(r), G = f(g), B = f(b);
  const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
  const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
  const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
  return [
    0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
  ];
}

// Расстояние между цветами (0 — идентичны, ~0.35+ — совсем разные)
function colorDist(hexA, hexB) {
  const a = oklab(...hexToRgb(hexA)), b = oklab(...hexToRgb(hexB));
  // светлота весит меньше — иначе тёмно-синий и чёрный «не похожи», хотя визуально близки
  const dl = (a[0] - b[0]) * 0.8, da = a[1] - b[1], db = a[2] - b[2];
  return Math.sqrt(dl * dl + da * da + db * db);
}

/**
 * Достаёт доминирующие цвета из изображения (прозрачные пиксели игнорируются).
 * Уменьшаем до 64x64 — быстро и достаточно точно.
 */
function extractPalette(source, k = 5) {
  const S = 64;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, S, S);
  const d = ctx.getImageData(0, 0, S, S).data;

  // грубая квантизация в кубы 32x32x32, затем слияние близких по OKLab
  const buckets = new Map();
  let total = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 140) continue;                       // фон вырезан — пропускаем
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const key = (r >> 5) * 64 + (g >> 5) * 8 + (b >> 5);
    let acc = buckets.get(key);
    if (!acc) buckets.set(key, acc = [0, 0, 0, 0]);
    acc[0] += r; acc[1] += g; acc[2] += b; acc[3]++;
    total++;
  }
  if (!total) return [];

  let list = [...buckets.values()]
    .map(a => ({ hex: rgbToHex(a[0] / a[3], a[1] / a[3], a[2] / a[3]), n: a[3] }))
    .sort((x, y) => y.n - x.n);

  const merged = [];
  for (const cand of list) {
    const near = merged.find(m => colorDist(m.hex, cand.hex) < 0.075);
    if (near) near.n += cand.n; else merged.push({ ...cand });
    if (merged.length >= k * 3) break;
  }
  return merged.slice(0, k).map(m => ({ hex: m.hex, ratio: +(m.n / total).toFixed(3) }));
}

 */
const SORTING_ICON = '🗃';
const SYSTEM_CATS = [
  { system: 'sorting', name: 'Сортировка', icon: SORTING_ICON, order: -2 },
  { system: 'review', name: 'На рассмотрении', icon: '🔍', order: -1 }
];
const sortingCat = () => state.cats.find(c => c.system === 'sorting') || null;
const isSystemCat = id => !!catById(id)?.system;

async function ensureSystemCats() {
  for (const def of SYSTEM_CATS) {
    if (state.cats.some(c => c.system === def.system)) continue;
    const cat = { id: uid('c'), custom: false, subs: [], ...def };
    state.cats.unshift(cat);
    await dbPut('cats', cat);
  }
}

/** Сообщения, которые показываются сразу после загрузки: что приложение починило само. */
const notices = [];

/**
 * Вещь без категории в гардеробе не видна — отдельного списка «без категории» нет
 * и не будет. Такие вещи приходят из старых резервных копий; отправляем их
 * в «Сортировку», где и лежит всё неразобранное.
 */
async function adoptOrphans() {
  const cat = sortingCat();
  if (!cat) return;
  // архивные не трогаем: их гардеробная категория нужна только при возврате,
  // и разбирается этот случай там же
  const lost = state.items.filter(i => !i.archived && !catById(i.catId));
  for (const it of lost) {
    it.catId = cat.id;
    it.subId = null;
    await dbPut('items', it);
  }
  if (lost.length) notices.push(lost.length === 1
    ? `Вещь без категории перенесена в «${cat.name}»`
    : `${nItems(lost.length)} без категории перенесены в «${cat.name}»`);
}

const listKey = key => 'list:' + key;

async function loadLists() {
  for (const key of Object.keys(LIST_DEFS)) {
    const rec = await dbGet('meta', listKey(key));
    // засеваем один раз и помним об этом: иначе удалённые значения

    if (rec && (rec.seeded || rec.items?.length)) { state.lists[key] = rec.items || []; continue; }
    state.lists[key] = (LIST_DEFS[key].seed || [])
      .map(x => ({ id: uid('l'), ...(typeof x === 'string' ? { name: x } : x) }));
    await dbPut('meta', { id: listKey(key), items: state.lists[key], seeded: true });
  }
}

/**
 * Списки всегда отдаются по алфавиту — и в фильтрах, и в карточке. Порядок
 * добавления ничего не говорит тому, кто ищет в списке глазами.
 * Сравнение в русской локали: кириллица идёт перед латиницей, как и везде
 * в телефоне с русским языком.
 */
const listItems = key =>
  [...(state.lists[key] || [])].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
const listEntry = (key, id) => listItems(key).find(e => e.id === id) || null;
const listName = (key, id) => listEntry(key, id)?.name || '';

async function saveList(key) {
  await dbPut('meta', { id: listKey(key), items: state.lists[key], seeded: true });
  emit();
}

async function addListEntry(key, patch) {
  const entry = { id: uid('l'), ...patch };
  state.lists[key] = [...listItems(key), entry];
  await saveList(key);
  return entry;
}
async function updateListEntry(key, id, patch) {
  const entry = listEntry(key, id);
  if (!entry) return null;
  Object.assign(entry, patch);
  await saveList(key);
  return entry;
}

/** Сколько вещей ссылается на значение списка — чтобы правка не была вслепую. */
function listUsage(key, id) {
  return state.items.filter(it => {
    if (key === 'brands') return it.brandId === id;
    if (key === 'colors') return (it.colorIds || []).includes(id);
    const m = it.material || {};
    return ['main', 'lining'].some(g => (m[g] || []).some(c => c.id === id));
  }).length;
}

/**
 * Перевод вещей с одного значения списка на другое; newId === null — просто
 * снять отметку. Нужен при удалении: вещь, потерявшая один цвет из трёх,
 * нигде не всплывает, поэтому удаление предлагает перенос, а не спрашивает
 * «точно?».
 */
async function replaceListRef(key, id, newId = null) {
  const touched = [];
  for (const it of state.items) {
    let changed = false;
    if (key === 'brands') {
      if (it.brandId === id) { it.brandId = newId; changed = true; }
    } else if (key === 'colors') {
      const list = it.colorIds || [];
      if (list.includes(id)) {
        const next = list.filter(x => x !== id);
        if (newId && !next.includes(newId)) next.push(newId);
        it.colorIds = next;
        changed = true;
      }
    } else {
      const m = it.material || {};
      for (const grp of ['main', 'lining']) {
        const list = m[grp] || [];
        if (!list.some(c => c.id === id)) continue;
        // если новое значение в составе уже есть, строка не задваивается
        m[grp] = !newId || list.some(c => c.id === newId)
          ? list.filter(c => c.id !== id)
          : list.map(c => c.id === id ? { ...c, id: newId } : c);
        changed = true;
      }
      if (changed) it.material = m;
    }
    if (changed) touched.push(it);
  }
  if (touched.length) await saveItems(touched);
}

async function deleteListEntry(key, id, newId = null) {
  await replaceListRef(key, id, newId);
  state.lists[key] = listItems(key).filter(e => e.id !== id);
  await saveList(key);
}

/**
 * Поездки раньше хранили образы и даты. Образы разворачиваем в вещи,
 * даты убираем, добавляем признак «состоялась».
 */
async function migrateTrips() {
  for (const t of state.trips) {
    if (!('outfitIds' in t) && !('from' in t) && 'done' in t) continue;
    const fromOutfits = (t.outfitIds || [])
      .flatMap(id => (state.outfits.find(o => o.id === id)?.layers || []).map(l => l.itemId));
    t.itemIds = [...new Set([...(t.itemIds || []), ...fromOutfits])];
    t.done = t.done ?? false;
    delete t.outfitIds;
    delete t.from;
    delete t.to;
    await dbPut('trips', t);
  }
}

/**
 * Коллекции образов были плоским списком-чипами — тем же, от чего отказался
 * гардероб. Превращаем их в категории образов: у образов теперь папки, как
 * у вещей, с подкатегориями и полным набором действий.
 */
async function migrateCollections() {
  if (!state.collections.length) return;
  for (const col of state.collections) {
    const cat = {
      id: col.id, name: col.name, order: state.cats.length,
      custom: true, scope: SCOPE_OUTFIT, subs: []
    };
    state.cats.push(cat);
    await dbPut('cats', cat);
    await dbDel('collections', col.id);
  }
  // номер категории совпадает с номером коллекции, поэтому образы
  // переставлять не нужно — достаточно переименовать поле
  for (const o of state.outfits) {
    if (!('collectionId' in o)) continue;
    o.catId = o.collectionId || null;
    o.subId = null;
    delete o.collectionId;
    await dbPut('outfits', o);
  }
  state.collections = [];
}

async function loadAll() {
  const [items, outfits, collections, cats, calendar, trips] = await Promise.all(
    ['items', 'outfits', 'collections', 'cats', 'calendar', 'trips'].map(dbAll)
  );
  state.items = items.sort((a, b) => b.createdAt - a.createdAt);
  state.outfits = outfits.sort((a, b) => b.createdAt - a.createdAt);
  state.collections = collections;
  state.calendar = calendar;
  state.trips = trips.sort((a, b) => b.createdAt - a.createdAt);
  await migrateTrips();

  if (!cats.length) {
    state.cats = DEFAULT_CATS.map((c, i) => ({
      id: uid('c'), name: c.name, icon: c.icon, order: i, custom: false,
      subs: c.subs.map(s => ({ id: uid('s'), name: s }))
    }));
    await Promise.all(state.cats.map(c => dbPut('cats', c)));
  } else {
    state.cats = cats.sort((a, b) => a.order - b.order);
  }
  await loadLists();
  await ensureSystemCats();
  await migrateCollections();
  await adoptOrphans();
}

/* ---------- items ---------- */
async function saveItem(item) {
  const idx = state.items.findIndex(i => i.id === item.id);
  if (idx >= 0) state.items[idx] = item; else state.items.unshift(item);
  await dbPut('items', item);
  emit();
  return item;
}
async function deleteItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  // подчищаем ссылки
  for (const o of state.outfits) {
    if (o.layers.some(l => l.itemId === id)) {
      o.layers = o.layers.filter(l => l.itemId !== id);
      await dbPut('outfits', o);
    }
  }
  for (const d of state.calendar) {
    if (d.itemIds?.includes(id)) { d.itemIds = d.itemIds.filter(x => x !== id); await dbPut('calendar', d); }
  }
  for (const t of state.trips) {
    if (t.itemIds?.includes(id)) {
      t.itemIds = t.itemIds.filter(x => x !== id);
      if (t.checked) delete t.checked[id];
      await dbPut('trips', t);
    }
  }
  await dbDel('items', id);
  emit();
}
const itemById = id => state.items.find(i => i.id === id);

/**
 * Единственный источник списка вещей для всего приложения: сетки гардероба,
 * выбор вещей для образа и чемодана, палитра, счётчики. Архивные сюда не
 * попадают, поэтому пометку «в архиве» достаточно будет учесть здесь одной.
 */
const visibleItems = () => state.items.filter(i => !i.archived);
const archivedItems = () => state.items.filter(i => i.archived);

/**
 * У архива свои категории, отдельные от гардеробных: раскладывать проданное
 * можно грубее или, наоборот, подробнее, чем то, что носится. Принадлежность
 * хранится в scope, и списки категорий всегда берутся через эти две функции —
 * иначе архивные категории рано или поздно просочатся в гардероб.
 */
const SCOPE_CLOSET = 'closet';
const SCOPE_ARCHIVE = 'archive';
const SCOPE_OUTFIT = 'outfit';
const catsIn = scope => state.cats
  .filter(c => (c.scope || SCOPE_CLOSET) === scope)
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const closetCats = () => catsIn(SCOPE_CLOSET);
const archiveCats = () => catsIn(SCOPE_ARCHIVE);
const outfitCats = () => catsIn(SCOPE_OUTFIT);

/** Сохранение пачкой: перерисовка одна на всю пачку, а не на каждую вещь. */
async function saveItems(items) {
  for (const item of items) {
    const idx = state.items.findIndex(i => i.id === item.id);
    if (idx >= 0) state.items[idx] = item; else state.items.unshift(item);
    await dbPut('items', item);
  }
  emit();
}

  if (idx >= 0) state.outfits[idx] = o; else state.outfits.unshift(o);
  await dbPut('outfits', o);

/**
 * Вещи образа. Вещь, ушедшая в архив, из образа не исчезает — иначе
 * календарь перестал бы соответствовать тому, что было надето. Но знать
 * о ней нужно: именно она портит счётчик носок при записи «на сегодня».
 */
const outfitItems = o => (o.layers || []).map(l => itemById(l.itemId)).filter(Boolean);
const archivedInOutfit = o => outfitItems(o).filter(i => i.archived);

/* ---------- collections (Style Book) ---------- */
async function saveCollection(c) {
  const idx = state.collections.findIndex(x => x.id === c.id);
  if (idx >= 0) state.collections[idx] = c; else state.collections.push(c);
  await dbPut('collections', c);
  emit();
  return c;
}
async function deleteCollection(id) {
  state.collections = state.collections.filter(c => c.id !== id);
  for (const o of state.outfits) {
    if (o.collectionId === id) { o.collectionId = null; await dbPut('outfits', o); }
  }
  await dbDel('collections', id);
  emit();
}

/* ---------- categories ---------- */
async function saveCat(c) {
  const idx = state.cats.findIndex(x => x.id === c.id);
  if (idx >= 0) state.cats[idx] = c; else state.cats.push(c);
  await dbPut('cats', c);
  emit();
  return c;
}
async function deleteCat(id) {
  if (catById(id)?.system) return false;      // служебную категорию удалять нельзя
  state.cats = state.cats.filter(c => c.id !== id);
  // номер категории уникален, поэтому чистим обе ссылки разом — гардеробную
  // и архивную: какая из них была, та и обнулится
  for (const it of state.items) {
    if (it.catId === id) { it.catId = null; it.subId = null; await dbPut('items', it); }
    else if (it.arcCatId === id) { it.arcCatId = null; it.arcSubId = null; await dbPut('items', it); }
  }
  for (const o of state.outfits) {
    if (o.catId === id) { o.catId = null; o.subId = null; await dbPut('outfits', o); }
  }
  await dbDel('cats', id);
  emit();
}
const catById = id => state.cats.find(c => c.id === id);

/**
 * Порядок категорий задаёт пользователь: ни алфавит, ни дата создания не
 * угадывают, что для него сейчас важнее. Номера переписываются подряд,
 * чтобы порядок не зависел от того, какие значения накопились раньше.
 */
async function moveCat(list, id, dir) {
  const i = list.findIndex(c => c.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return false;
  const next = [...list];
  next.splice(j, 0, next.splice(i, 1)[0]);
  for (let k = 0; k < next.length; k++) next[k].order = k;
  for (const c of next) await dbPut('cats', c);
  emit();
  return true;
}

/** Новая категория встаёт первой: только что заведённая — обычно и нужная. */
const nextCatOrder = list =>
  (list.length ? Math.min(...list.map(c => c.order ?? 0)) : 0) - 1;
function subById(catId, subId) {
  return catById(catId)?.subs.find(s => s.id === subId) || null;
}
const countInCat = id => visibleItems().filter(i => i.catId === id).length;
const countInArcCat = id => archivedItems().filter(i => i.arcCatId === id).length;
const outfitsIn = catId => state.outfits.filter(o => (o.catId || null) === catId);
const countInOutfitCat = id => outfitsIn(id).length;

/** Сколько вещей в категории — с учётом того, гардеробная она или архивная. */
const countIn = cat => cat.scope === SCOPE_ARCHIVE ? countInArcCat(cat.id)
  : cat.scope === SCOPE_OUTFIT ? countInOutfitCat(cat.id)
    : countInCat(cat.id);

/**
 * Гардероб как таковой: без архива и без рабочих полок. «Сортировка» ещё не
 * разобрана, «На рассмотрении» ещё не куплено — ни то, ни другое гардеробом
 * пока не является, поэтому «Все вещи», счётчики и фильтры берут этот список.
 */
const closetItems = () => visibleItems().filter(i => !isSystemCat(i.catId));
const closetCount = () => closetItems().length;
const countInSystem = system =>
  countInCat(state.cats.find(c => c.system === system)?.id);

/* ===== editor.js ===== */
// Редактор изображения вещи: ML-удаление фона + ручные инструменты (волшебная палочка,
// ластик, восстановление, прямоугольный и свободный кроп).
// Снимок можно увеличить — щипком, колесом или кнопками; это нужно ластику,
// которым убирают мелочь вроде вешалки или травинки под подолом.

const IMGLY_URL = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm';
const MAX_SIDE = 1400;
let mlModule = null;   // кэшируем модуль между вызовами

function imageFromBlob(blob) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = typeof blob === 'string' ? blob : URL.createObjectURL(blob);
  });
}

const canvasToBlob = (c, type = 'image/png') =>
  new Promise(res => c.toBlob(res, type, 0.92));

/**
 * Ужимает снимок перед сохранением: фото с телефона весит 4–6 МБ, а в карточке
 * и в образе разница не видна. Прозрачность сохраняем только у PNG.
 */
async function downscaleBlob(blob, max = 1600) {
  const img = await imageFromBlob(blob);
  const w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, max / Math.max(w, h));
  if (scale === 1 && blob.size < 1_500_000) return blob;   // уже компактно
  const c = document.createElement('canvas');
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const png = blob.type === 'image/png';
  return new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.88));
}

/** Обрезает прозрачные поля вокруг вещи. */
function trimTransparent(src) {
  const ctx = src.getContext('2d', { willReadFrequently: true });
  const { width: w, height: h2 } = src;
  const d = ctx.getImageData(0, 0, w, h2).data;
  let minX = w, minY = h2, maxX = -1, maxY = -1;
  for (let y = 0; y < h2; y++) {
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 12) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return src;
  const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03);
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h2 - 1, maxY + pad);
  const out = document.createElement('canvas');
  out.width = maxX - minX + 1; out.height = maxY - minY + 1;
  out.getContext('2d').drawImage(src, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

/**
 * Открывает редактор. Возвращает Promise<Blob|null> — PNG с прозрачным фоном.
 * @param {Blob|string} source исходное изображение
 * @param {boolean} autoAI сразу запустить ML-удаление фона
 */
async function openImageEditor(source, { autoAI = false } = {}) {
  const img = await imageFromBlob(source);

  // рабочий холст (ограничиваем размер — иначе тормозит на телефоне)
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth * scale), H = Math.round(img.naturalHeight * scale);

  const orig = document.createElement('canvas');
  orig.width = W; orig.height = H;
  orig.getContext('2d').drawImage(img, 0, 0, W, H);

  let work = document.createElement('canvas');
  work.width = W; work.height = H;
  work.getContext('2d', { willReadFrequently: true }).drawImage(orig, 0, 0);

  const history = [];
  const pushHistory = () => {
    if (history.length > 7) history.shift();
    const c = document.createElement('canvas');
    c.width = work.width; c.height = work.height;
    c.getContext('2d').drawImage(work, 0, 0);
    history.push(c);
    updateChrome();
  };

  /* ---------- разметка ---------- */
  const canvas = h('canvas', { id: 'ed-canvas' });

  /* ---------- масштаб ----------
   * Мелкую деталь на вписанном в экран снимке не стереть: один «пиксель»
   * пальца — это несколько пикселей изображения, и промах неизбежен.
   * Уменьшением кисти это не лечится — кисть упирается в точность пальца,
   * а не в свой размер. Лечится увеличением.
   *
   * Увеличение **только видимое**: холст и все инструменты продолжают
   * работать в пикселях изображения. Ничего пересчитывать не пришлось —
   * toWork() считает по видимому прямоугольнику холста, а тот уже учитывает
   * любое преобразование.
   */
  const ZOOM_MIN = 1, ZOOM_MAX = 8;
  let zoom = 1, panX = 0, panY = 0;
  const zoomLbl = h('b', {}, '100%');

  /** Не даём утащить снимок за край: вернуться к нему было бы нечем. */
  function clampPan() {
    const mx = Math.max(0, (canvas.offsetWidth * zoom - wrap.clientWidth) / 2);
    const my = Math.max(0, (canvas.offsetHeight * zoom - wrap.clientHeight) / 2);
    panX = Math.min(mx, Math.max(-mx, panX));
    panY = Math.min(my, Math.max(-my, panY));
  }

  function applyView() {
    clampPan();
    canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    zoomLbl.textContent = Math.round(zoom * 100) + '%';
  }

  /** Масштаб вокруг точки экрана: то, что под пальцем, под ним и остаётся. */
  function zoomAt(next, cx, cy) {
    next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    const r = wrap.getBoundingClientRect();
    const vx = (cx - (r.left + r.width / 2) - panX) / zoom;
    const vy = (cy - (r.top + r.height / 2) - panY) / zoom;
    panX = cx - (r.left + r.width / 2) - next * vx;
    panY = cy - (r.top + r.height / 2) - next * vy;
    zoom = next;
    applyView();
  }

  const wrapCenter = () => {
    const r = wrap.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };
  const stepZoom = k => zoomAt(zoom * k, ...wrapCenter());
  const resetView = () => { zoom = 1; panX = panY = 0; applyView(); };

  // кнопки поверх холста: на телефоне есть щипок, но на нём свет клином не
  // сошёлся — мышью и одним пальцем тоже надо уметь
  const zoomBar = h('div', { class: 'zoom-bar' },
    h('button', { class: 'zb', title: 'Мельче', onclick: () => stepZoom(1 / 1.6) }, '−'),
    zoomLbl,
    h('button', { class: 'zb', title: 'Крупнее', onclick: () => stepZoom(1.6) }, '+'),
    h('button', { class: 'zb wide', title: 'Вписать целиком', onclick: resetView }, '1:1')
  );

  const wrap = h('div', { id: 'ed-wrap' }, canvas, zoomBar);
  const opts = h('div', { class: 'tool-opts' });
  const toolbar = h('div', { class: 'tools' });

  let tool = 'wand';
  let tolerance = 0.18, brush = 34;

  const TOOLS = [
    { id: 'ai', ic: '✨', label: 'ИИ-фон', action: runAI },
    { id: 'wand', ic: '🪄', label: 'Палочка' },
    { id: 'erase', ic: '🧽', label: 'Ластик' },
    { id: 'restore', ic: '↩️', label: 'Вернуть' },
    { id: 'crop', ic: '⬛', label: 'Кроп' },
    { id: 'lasso', ic: '✂️', label: 'Лассо' },
    { id: 'undo', ic: '⟲', label: 'Отменить', action: undo },
    { id: 'reset', ic: '⟳', label: 'Сброс', action: reset }
  ];

  function renderToolbar() {
    fill(toolbar, ...TOOLS.map(t =>
      h('button', {
        class: 'tool' + (tool === t.id ? ' active' : ''),
        onclick: () => {
          if (t.action) { t.action(); return; }
          tool = t.id; cropRect = null; renderToolbar(); renderOpts(); render();
        }
      }, h('span', { class: 'ic' }, t.ic), h('span', {}, t.label))
    ));
  }

  function renderOpts() {
    opts.replaceChildren();
    if (tool === 'wand') {
      const r = h('input', { type: 'range', min: 2, max: 60, value: Math.round(tolerance * 100), oninput: e => { tolerance = e.target.value / 100; lbl.textContent = `Чувствительность: ${e.target.value}%`; } });
      const lbl = h('div', { class: 'muted small' }, `Чувствительность: ${Math.round(tolerance * 100)}%`);
      opts.append(lbl, r, h('div', { class: 'muted small' }, 'Нажмите на фон — область удалится.'));
    } else if (tool === 'erase' || tool === 'restore') {
      const lbl = h('div', { class: 'muted small' }, `Кисть: ${brush} px`);
      opts.append(lbl, h('input', { type: 'range', min: 2, max: 140, value: brush, oninput: e => { brush = +e.target.value; lbl.textContent = `Кисть: ${brush} px`; } }));
    } else if (tool === 'crop') {
      opts.append(h('div', { class: 'row' },
        h('span', { class: 'muted small spacer' }, 'Выделите прямоугольник'),
        h('button', { class: 'btn btn-sm primary', onclick: applyCrop }, 'Применить')));
    } else if (tool === 'lasso') {
      opts.append(h('div', { class: 'muted small' }, 'Обведите вещь пальцем — всё снаружи удалится.'));
    }
  }

  const doneBtn = h('button', { class: 'btn primary', onclick: finish }, 'Готово');
  let resolveFn;
  const modal = openModal({
    title: 'Обработка фото',
    full: true,
    body: h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', margin: '-12px' } }, wrap, opts, toolbar),
    foot: [h('button', { class: 'btn', onclick: () => { modal.close(); } }, 'Отмена'), doneBtn],
    onClose: () => resolveFn && resolveFn(null)
  });

  function updateChrome() {
    const u = TOOLS.find(t => t.id === 'undo');
    const btn = [...toolbar.children][TOOLS.indexOf(u)];
    if (btn) btn.disabled = history.length === 0;
  }

  /* ---------- отрисовка ---------- */
  let cropRect = null, lassoPts = null, hoverPt = null;
  function render() {
    canvas.width = work.width; canvas.height = work.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(work, 0, 0);
    if (cropRect) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.rect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      ctx.fill('evenodd');
      ctx.strokeStyle = '#c1785c'; ctx.lineWidth = 3;
      ctx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      ctx.restore();
    }
    if (lassoPts && lassoPts.length > 1) {
      ctx.save();
      ctx.strokeStyle = '#c1785c'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(lassoPts[0].x, lassoPts[0].y);
      lassoPts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.restore();
    }
    if (hoverPt && (tool === 'erase' || tool === 'restore')) {
      ctx.save();
      ctx.strokeStyle = tool === 'erase' ? '#d94f45' : '#4f8a5b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hoverPt.x, hoverPt.y, brush / 2, 0, 7); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- ввод ---------- */
  const toWork = e => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * canvas.width / r.width,
      y: (e.clientY - r.top) * canvas.height / r.height
    };
  };

  let drawing = false, last = null, startPt = null;

  // Пальцы на холсте. Один — инструмент, два — щипок: иначе рисование и
  // перемещение подрались бы за одно и то же движение.
  const pts = new Map();
  let pinch = null;

  /**
   * Второй палец отменяет уже начатый мазок. Без этого каждый щипок оставлял
   * бы точку в том месте, где человек просто коснулся экрана первым пальцем.
   */
  function cancelStroke() {
    if (!drawing) return;
    drawing = false; last = null;
    if (tool === 'crop') { cropRect = null; render(); return; }
    undo();   // ластик, восстановление и лассо успели записать шаг в историю
  }

  function startPinch() {
    const [a, b] = [...pts.values()];
    pinch = {
      dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
      zoom, panX, panY
    };
  }

  function movePinch() {
    const [a, b] = [...pts.values()];
    const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinch.zoom * dist / pinch.dist));
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // точка снимка, что была под серединой между пальцами, остаётся под ней
    const vx = (pinch.mx - cx - pinch.panX) / pinch.zoom;
    const vy = (pinch.my - cy - pinch.panY) / pinch.zoom;
    panX = mx - cx - next * vx;
    panY = my - cy - next * vy;
    zoom = next;
    applyView();
  }

  canvas.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { cancelStroke(); startPinch(); return; }
    if (pts.size > 2) return;

    try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
    const p = toWork(e);
    if (tool === 'wand') { pushHistory(); magicWand(p.x | 0, p.y | 0); render(); return; }
    drawing = true; last = p; startPt = p;
    if (tool === 'erase' || tool === 'restore') { pushHistory(); paint(p, p); render(); }
    if (tool === 'lasso') { pushHistory(); lassoPts = [p]; }
    if (tool === 'crop') cropRect = { x: p.x, y: p.y, w: 0, h: 0 };
  });

  canvas.addEventListener('pointermove', e => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch) { if (pts.size >= 2) movePinch(); return; }
    if (pts.size > 1) return;

    const p = toWork(e);
    hoverPt = p;
    if (!drawing) { if (tool === 'erase' || tool === 'restore') render(); return; }
    if (tool === 'erase' || tool === 'restore') { paint(last, p); last = p; render(); }
    else if (tool === 'lasso') { lassoPts.push(p); render(); }
    else if (tool === 'crop') {
      cropRect = {
        x: Math.min(startPt.x, p.x), y: Math.min(startPt.y, p.y),
        w: Math.abs(p.x - startPt.x), h: Math.abs(p.y - startPt.y)
      };
      render();
    }
  });

  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pinch) {
      // пока палец на экране один, щипок не возобновляем: оставшийся палец
      // не должен внезапно начать рисовать с середины жеста
      if (!pts.size) pinch = null;
      drawing = false; last = null;
      return;
    }
    if (drawing && tool === 'lasso' && lassoPts && lassoPts.length > 4) applyLasso();
    drawing = false; last = null;
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { hoverPt = null; render(); });

  // мышью — колесом: на компьютере щипка нет
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  /* ---------- инструменты ---------- */
  function paint(from, to) {
    const ctx = work.getContext('2d');
    const r = brush / 2;
    const dist = Math.hypot(to.x - from.x, to.y - from.y);
    const steps = Math.max(1, Math.ceil(dist / (r / 2)));
    for (let i = 0; i <= steps; i++) {
      const x = from.x + (to.x - from.x) * i / steps;
      const y = from.y + (to.y - from.y) * i / steps;
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
      if (tool === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fill();
      } else {
        ctx.clip();
        ctx.drawImage(orig, 0, 0);
      }
      ctx.restore();
    }
  }

  // Заливка по клику: убираем связную область близкого цвета (аналог "Tap Background")
  function magicWand(sx, sy) {
    const ctx = work.getContext('2d', { willReadFrequently: true });
    const w = work.width, hgt = work.height;
    const img = ctx.getImageData(0, 0, w, hgt);
    const d = img.data;
    const idx = (sy * w + sx) * 4;
    if (d[idx + 3] === 0) return;
    const sr = d[idx], sg = d[idx + 1], sb = d[idx + 2];
    const thr = tolerance * 255 * 1.732;
    const seen = new Uint8Array(w * hgt);
    const stack = [sy * w + sx];
    seen[sy * w + sx] = 1;
    let count = 0;
    while (stack.length) {
      const p = stack.pop();
      const i4 = p * 4;
      const dr = d[i4] - sr, dg = d[i4 + 1] - sg, db = d[i4 + 2] - sb;
      if (Math.sqrt(dr * dr + dg * dg + db * db) > thr) continue;
      d[i4 + 3] = 0;
      count++;
      const x = p % w, y = (p / w) | 0;
      if (x > 0 && !seen[p - 1]) { seen[p - 1] = 1; stack.push(p - 1); }
      if (x < w - 1 && !seen[p + 1]) { seen[p + 1] = 1; stack.push(p + 1); }
      if (y > 0 && !seen[p - w]) { seen[p - w] = 1; stack.push(p - w); }
      if (y < hgt - 1 && !seen[p + w]) { seen[p + w] = 1; stack.push(p + w); }
    }
    ctx.putImageData(img, 0, 0);
    if (!count) toast('Здесь нечего удалять');
  }

  function applyCrop() {
    if (!cropRect || cropRect.w < 8 || cropRect.h < 8) { toast('Сначала выделите область'); return; }
    pushHistory();
    const out = document.createElement('canvas');
    out.width = Math.round(cropRect.w); out.height = Math.round(cropRect.h);
    out.getContext('2d').drawImage(work, Math.round(cropRect.x), Math.round(cropRect.y),
      out.width, out.height, 0, 0, out.width, out.height);
    work = out;
    cropRect = null;
    render(); resetView();
  }

  function applyLasso() {
    const mask = document.createElement('canvas');
    mask.width = work.width; mask.height = work.height;
    const mc = mask.getContext('2d');
    mc.beginPath();
    mc.moveTo(lassoPts[0].x, lassoPts[0].y);
    lassoPts.forEach(p => mc.lineTo(p.x, p.y));
    mc.closePath();
    mc.fillStyle = '#fff'; mc.fill();
    const ctx = work.getContext('2d');
    ctx.save();
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(mask, 0, 0);
    ctx.restore();
    lassoPts = null;
    render();
  }

  async function runAI() {
    toast('ИИ-вырезание недоступно в веб-демо — уберите фон «Палочкой»', 3800);
    return;
    busy(true, mlModule ? 'Удаляю фон…' : 'Загружаю ИИ-модель (~40 МБ, только первый раз)…');
    try {
      if (!mlModule) mlModule = await import(/* @vite-ignore */ IMGLY_URL);
      const fn = mlModule.removeBackground || mlModule.default;
      const srcBlob = await canvasToBlob(work);
      const outBlob = await fn(srcBlob, {
        output: { format: 'image/png', quality: 0.9 },
        progress: (key, cur, total) => {
          if (key.startsWith('fetch')) busy(true, `Загружаю модель: ${Math.round(cur / total * 100)}%`);
          else busy(true, 'Удаляю фон…');
        }
      });
      const outImg = await imageFromBlob(outBlob);
      pushHistory();
      const ctx = work.getContext('2d');
      ctx.clearRect(0, 0, work.width, work.height);
      ctx.drawImage(outImg, 0, 0, work.width, work.height);
      render();
      toast('Фон удалён');
    } catch (err) {
      console.error(err);
      toast('ИИ недоступен — используйте «Палочку»', 3200);
    } finally {
      busy(false);
    }
  }

  function undo() {
    const prev = history.pop();
    if (!prev) return;
    work = prev;
    cropRect = null; lassoPts = null;
    render(); updateChrome();
  }

  function reset() {
    pushHistory();
    work = document.createElement('canvas');
    work.width = W; work.height = H;
    work.getContext('2d', { willReadFrequently: true }).drawImage(orig, 0, 0);
    cropRect = null; lassoPts = null;
    render(); resetView();
  }

  async function finish() {
    doneBtn.disabled = true;
    const trimmed = trimTransparent(work);
    const blob = await canvasToBlob(trimmed);
    const r = resolveFn; resolveFn = null;
    modal.close();
    r(blob);
  }

  renderToolbar(); renderOpts(); render(); updateChrome(); applyView();
  if (autoAI) setTimeout(runAI, 120);

  return new Promise(res => { resolveFn = res; });
}

// Источники изображений: галерея, камера, а также «пипетка» цвета с камеры.

function pickImageFile() {
  return new Promise(res => {
    const input = qs('#file-input');
    const onChange = () => {
      input.removeEventListener('change', onChange);
      const f = input.files && input.files[0];
      input.value = '';
      res(f || null);
    };
    input.addEventListener('change', onChange);
    input.click();
  });
}

/** Выбор нескольких файлов за раз. Больше max за один заход не берём —
 *  это защита от случайного «выделить всю галерею». */
function pickImageFiles(max = 10) {
  return new Promise(res => {
    const input = qs('#file-input-multi');
    const onChange = () => {
      input.removeEventListener('change', onChange);
      const files = [...(input.files || [])];
      input.value = '';
      if (files.length > max) {
        toast(`За раз можно добавить не больше ${max} — выбрано ${files.length}`, 3800);
        res(null);
        return;
      }
      res(files);
    };
    input.addEventListener('change', onChange);
    input.click();
  });
}

async function startStream(video) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  return stream;
}

function cameraUnavailable(err) {
  console.warn(err);
  toast('Камера недоступна в веб-демо — добавьте фото из галереи', 3600);
}

/** Снимок вещи камерой. Возвращает Blob|null. */
function captureFromCamera() {
  return new Promise(async res => {
    const video = h('video', { id: 'cam', playsinline: true, muted: true });
    let stream = null, done = false;
    const modal = openModal({
      title: 'Снять вещь',
      body: h('div', {}, video, h('p', { class: 'muted small center' }, 'Положите вещь на однотонный фон — фон потом уберём.')),
      foot: [
        h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
        h('button', {
          class: 'btn primary', onclick: () => {
            const c = document.createElement('canvas');
            c.width = video.videoWidth; c.height = video.videoHeight;
            c.getContext('2d').drawImage(video, 0, 0);
            c.toBlob(b => { done = true; stop(); modal.close(); res(b); }, 'image/png');
          }
        }, '📸 Снять')
      ],
      onClose: () => { stop(); if (!done) res(null); }
    });
    function stop() { stream?.getTracks().forEach(t => t.stop()); }
    try { stream = await startStream(video); }
    catch (e) { cameraUnavailable(e); modal.close(); }
  });
}

/** Пипетка: наводим камеру, тапаем по кадру — получаем hex. */
function scanColorFromCamera() {
  return new Promise(async res => {
    const video = h('video', { id: 'cam', playsinline: true, muted: true });
    const sw = h('div', { class: 'swatch', style: { width: '54px', height: '54px', background: '#ffffff' } });
    const label = h('b', {}, '—');
    let picked = null, stream = null, done = false;

    video.addEventListener('click', e => {
      const r = video.getBoundingClientRect();
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0);
      const x = Math.round((e.clientX - r.left) * c.width / r.width);
      const y = Math.round((e.clientY - r.top) * c.height / r.height);
      // усредняем 9x9 — так цвет стабильнее
      const d = ctx.getImageData(Math.max(0, x - 4), Math.max(0, y - 4), 9, 9).data;
      let R = 0, G = 0, B = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
      picked = rgbToHex(R / n, G / n, B / n);
      sw.style.background = picked;
      label.textContent = picked.toUpperCase();
    });

    const modal = openModal({
      title: 'Сканировать цвет',
      body: h('div', {}, video,
        h('p', { class: 'muted small center' }, 'Тапните по кадру, чтобы взять цвет'),
        h('div', { class: 'row', style: { justifyContent: 'center', gap: '12px' } }, sw, label)),
      foot: [
        h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
        h('button', { class: 'btn primary', onclick: () => { if (!picked) return toast('Сначала тапните по кадру'); done = true; stop(); modal.close(); res(picked); } }, 'Искать')
      ],
      onClose: () => { stop(); if (!done) res(null); }
    });
    function stop() { stream?.getTracks().forEach(t => t.stop()); }
    try { stream = await startStream(video); }
    catch (e) { cameraUnavailable(e); modal.close(); }
  });
}

// Универсальный выбор вещей / образов (для образов, календаря, чемодана).

const NO_CAT = '__nocat';
const NO_SUB = '__nosub';
const ALL = '__all';

/** Строка-папка. Одна на оба выбора: вещи и образы ходят одинаково. */
const navRow = ({ label, note, onclick, muted, back }) => h('div', {
  class: 'lrow nav' + (muted ? ' soft' : ''), onclick
},
  back ? h('span', { class: 'chev back' }, '\u2039') : null,
  h('div', { class: 't' }, h('b', {}, label), note ? h('span', {}, note) : null),
  back ? null : h('span', { class: 'chev' }, '\u203a')
);

/**
 * Выбор вещей: категория → подкатегория → сетка, как в «Гардеробе» и в
 * выборе образов. Рядом чипов это быть не может — когда категорий станет
 * много, горизонтальный ряд перестанет помещаться.
 *
 * Архивные вещи сюда не попадают: «Гардероб» — это то, что есть на руках.
 * Архивное приходит в поездку другим путём — из прошлой поездки или образа.
 */
function pickItems({ title = 'Выбрать вещи', selected = [], multi = true } = {}) {
  return new Promise(res => {
    const sel = new Set(selected);
    let catId = null, subId = null;
    let done = false;

    const body = h('div', {});
    const titleEl = h('span', {}, title);
    const doneBtn = h('button', {
      class: 'btn primary',
      onclick: () => { done = true; modal.close(); res([...sel]); }
    }, 'Готово');

    const catOf = id => closetCats().find(c => c.id === id) || null;
    const inCat = id => visibleItems().filter(i => (i.catId || null) === (id === NO_CAT ? null : id));
    const subsOf = cat => (cat?.subs || []).filter(sb => inCat(cat.id).some(i => i.subId === sb.id));

    function listed() {
      if (catId === ALL) return visibleItems();
      const cat = catOf(catId);
      const pool = inCat(catId);
      if (!subId) return pool;
      const own = new Set(subsOf(cat).map(sb => sb.id));
      return pool.filter(i => subId === NO_SUB ? !own.has(i.subId) : i.subId === subId);
    }

    const go = (c, sb = null) => { catId = c; subId = sb; render(); };

    const tile = it => h('div', {
      class: 'tile' + (sel.has(it.id) ? ' sel' : ''),
      style: { background: bgCss(it.bg) },
      onclick: () => {
        if (!multi) { done = true; modal.close(); return res([it.id]); }
        sel.has(it.id) ? sel.delete(it.id) : sel.add(it.id);
        render();
      }
    }, h('img', { src: urlFor(it.img) }));

    function render() {
      doneBtn.textContent = sel.size ? `Готово · ${sel.size}` : 'Готово';
      const cats = closetCats().filter(c => inCat(c.id).length);
      const loose = inCat(NO_CAT).length;

      // корень: папки. Категорий нет — показывать нечего, сразу сетка
      if (catId === null && cats.length) {
        titleEl.textContent = title;
        return fill(body,
          h('div', { class: 'list' },
            navRow({
              label: 'Все вещи', note: nItems(visibleItems().length),
              onclick: () => go(ALL)
            }),
            ...cats.map(c => navRow({
              label: `${c.icon || ''} ${c.name}`.trim(),
              note: nItems(inCat(c.id).length)
                + (subsOf(c).length ? ' · ' + subsOf(c).length + ' подкат.' : ''),
              onclick: () => go(c.id)
            })),
            loose ? navRow({
              label: 'Без категории', note: nItems(loose), muted: true,
              onclick: () => go(NO_CAT)
            }) : null
          )
        );
      }

      const cat = catOf(catId);
      const subs = cat ? subsOf(cat) : [];
      const sublessN = cat ? inCat(cat.id).filter(i => !subs.some(sb => sb.id === i.subId)).length : 0;
      titleEl.textContent = catId === ALL ? 'Все вещи'
        : catId === NO_CAT ? 'Без категории'
          : subId ? (subId === NO_SUB ? 'Другое' : subs.find(sb => sb.id === subId)?.name || cat.name)
            : cat?.name || title;

      if (cat && subs.length && !subId) {
        return fill(body,
          h('div', { class: 'list' },
            navRow({ label: 'Категории', back: true, onclick: () => go(null) }),
            ...subs.map(sb => navRow({
              label: sb.name, note: nItems(inCat(cat.id).filter(i => i.subId === sb.id).length),
              onclick: () => go(cat.id, sb.id)
            })),
            sublessN ? navRow({
              label: 'Другое', note: nItems(sublessN), muted: true,
              onclick: () => go(cat.id, NO_SUB)
            }) : null
          )
        );
      }

      const list = listed();
      const up = subId ? () => go(cat.id) : cats.length ? () => go(null) : null;
      fill(body,
        up ? h('div', { class: 'list' }, navRow({ label: 'Назад', back: true, onclick: up })) : null,
        list.length ? h('div', { class: 'grid' }, list.map(tile))
          : h('div', { class: 'empty' }, 'Здесь пусто')
      );
    }
    render();

    const modal = openModal({
      title: titleEl, full: true, body,
      foot: multi ? [
        h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
        doneBtn
      ] : null,
      onClose: () => { if (!done) res(null); }
    });
  });
}

/**
 * Выбор образов. Устроен как вкладка: категория → подкатегория → образы,
 * с возвратом строкой «‹ назад» в самом списке. Строками фильтров это быть
 * не может — когда категорий станет много, горизонтальный ряд перестанет
 * помещаться, ровно как было в «Гардеробе» до перехода на папки.
 *
 * multi = false (календарь): нажатие на образ и есть выбор, «Готово» не нужно.
 * multi = true (чемодан): отмечаем несколько и подтверждаем.
 */
function pickOutfits({ title = 'Выбрать образы', selected = [], multi = true } = {}) {
  return new Promise(res => {
    const sel = new Set(selected);
    let catId = null, subId = null;
    let done = false;

    const body = h('div', {});
    const titleEl = h('span', {}, title);

    const catOf = id => outfitCats().find(c => c.id === id) || null;
    const inCat = id => state.outfits.filter(o => (o.catId || null) === (id === NO_CAT ? null : id));
    const subsOf = cat => (cat?.subs || []).filter(sb => inCat(cat.id).some(o => o.subId === sb.id));

    function listed() {
      if (catId === null) return state.outfits;              // «Все образы»
      const cat = catOf(catId);
      const pool = inCat(catId);
      if (!subId) return pool;
      const own = new Set(subsOf(cat).map(sb => sb.id));
      return pool.filter(o => subId === NO_SUB ? !own.has(o.subId) : o.subId === subId);
    }

    const go = (c, sb = null) => { catId = c; subId = sb; render(); };

    const tile = o => {
      const gone = archivedInOutfit(o).length;
      return h('div', {
        class: 'tile' + (sel.has(o.id) ? ' sel' : '') + (gone ? ' has-gone' : ''),
        onclick: () => {
          if (!multi) { done = true; modal.close(); return res([o.id]); }
          sel.has(o.id) ? sel.delete(o.id) : sel.add(o.id);
          render();
        }
      },
        h('img', { src: urlFor(o.preview) }),
        gone ? h('span', { class: 'gone-mark', title: 'В образе есть вещь из архива' }, '◷') : null,
        h('span', { class: 'lbl' }, o.name || 'Образ')
      );
    };

    function render() {
      const cats = outfitCats().filter(c => inCat(c.id).length);
      const loose = inCat(NO_CAT).length;

      // корень: папки. Без категорий показывать нечего — сразу сетка
      if (catId === null && cats.length) {
        titleEl.textContent = title;
        return fill(body,
          h('div', { class: 'list' },
            navRow({
              label: 'Все образы', note: nOutfits(state.outfits.length),
              onclick: () => { catId = ALL; render(); }
            }),
            ...cats.map(c => navRow({
              label: c.name,
              note: nOutfits(inCat(c.id).length)
                + (subsOf(c).length ? ' · ' + subsOf(c).length + ' подкат.' : ''),
              onclick: () => go(c.id)
            })),
            loose ? navRow({
              label: 'Без категории', note: nOutfits(loose), muted: true,
              onclick: () => go(NO_CAT)
            }) : null
          )
        );
      }

      const cat = catOf(catId);
      const subs = cat ? subsOf(cat) : [];
      const sublessN = cat ? inCat(cat.id).filter(o => !subs.some(sb => sb.id === o.subId)).length : 0;
      titleEl.textContent = catId === ALL ? 'Все образы'
        : catId === NO_CAT ? 'Без категории'
          : subId ? (subId === NO_SUB ? 'Другое' : subs.find(sb => sb.id === subId)?.name || cat.name)
            : cat?.name || title;

      // уровень подкатегорий — если они есть и мы ещё не внутри одной
      if (cat && subs.length && !subId) {
        return fill(body,
          h('div', { class: 'list' },
            navRow({ label: 'Категории', back: true, onclick: () => go(null) }),
            ...subs.map(sb => navRow({
              label: sb.name, note: nOutfits(inCat(cat.id).filter(o => o.subId === sb.id).length),
              onclick: () => go(cat.id, sb.id)
            })),
            sublessN ? navRow({
              label: 'Другое', note: nOutfits(sublessN), muted: true,
              onclick: () => go(cat.id, NO_SUB)
            }) : null
          )
        );
      }

      const list = catId === ALL ? state.outfits : listed();
      const up = subId ? () => go(cat.id) : cats.length ? () => go(null) : null;
      fill(body,
        up ? h('div', { class: 'list' }, navRow({ label: 'Назад', back: true, onclick: up })) : null,
        list.length ? h('div', { class: 'grid g2' }, list.map(tile))
          : h('div', { class: 'empty' }, 'Здесь пусто')
      );
    }
    render();

    const modal = openModal({
      title: titleEl, full: true, body,
      foot: multi ? [
        h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
        h('button', { class: 'btn primary', onclick: () => { done = true; modal.close(); res([...sel]); } }, 'Готово')
      ] : null,
      onClose: () => { if (!done) res(null); }
    });
  });
}
