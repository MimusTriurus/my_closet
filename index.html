<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>YourCloset — прототип</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>">
<script src="vendor/konva.min.js"></script>
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="tb-left"><button id="tb-back" class="icon-btn" hidden aria-label="Назад">‹</button></div>
    <h1 id="tb-title">Гардероб</h1>
    <div class="tb-right" id="tb-actions"></div>
  </header>

  <main id="views">
    <section class="view" id="view-closet"></section>
    <section class="view" id="view-outfits" hidden></section>
    <section class="view" id="view-calendar" hidden></section>
    <section class="view" id="view-packing" hidden></section>
  </main>

  <nav id="tabbar">
    <button data-tab="closet" class="active"><span class="ic">🧺</span><span>Гардероб</span></button>
    <button data-tab="outfits"><span class="ic">👗</span><span>Образы</span></button>
    <button data-tab="calendar"><span class="ic">🗓</span><span>Календарь</span></button>
    <button data-tab="packing"><span class="ic">🧳</span><span>Чемодан</span></button>
  </nav>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busy-text">Обработка…</div></div></div>

<input type="file" id="file-input" accept="image/*" hidden>
<input type="file" id="file-input-multi" accept="image/*" multiple hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
