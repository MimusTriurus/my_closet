// Вкладка «Гардероб»: категории, подкатегории, фильтр по цвету, сортировка, карточка вещи.
import {
  fill, h, qs, urlFor, toast, openModal, confirmDialog, actionSheet, busy, plural, nItems
} from './ui.js';
import {
  state, saveItem, saveItems, deleteItem, catById, subById, countInCat,
  visibleItems, archivedItems, itemById, closetCats, archiveCats, countInArcCat,
  SCOPE_CLOSET, SCOPE_ARCHIVE,
  createItem, sortingCat, emit, listEntry, lastCurrency, wearCount, closetItems
} from './state.js';

/**
 * Фильтры живут в «Все вещи» и «Весь архив» — по категориям ходит nav.
 * Наборы у гардероба и архива **раздельные**: это разные пространства, и
 * фильтр, выставленный в одном, не должен встречать в другом.
 */
const newFilters = () => ({ color: null, brand: null, material: null, favOnly: false, sort: 'new' });
const FILTERS = { closet: newFilters(), archive: newFilters() };
const filters = (arc = nav.archive) => FILTERS[arc ? 'archive' : 'closet'];

/* ---------- добавление вещи ---------- */
async function addItemFlow(sourceBlob, preset = {}) {
  const blob = await openImageEditor(sourceBlob, { autoAI: preset.autoAI !== false });
  if (!blob) return null;
  busy(true, 'Анализирую цвета…');
  let colors = [];
  try {
    const img = await imageFromBlob(blob);
    colors = extractPalette(img, 5);
  } catch (e) { console.warn(e); }
  busy(false);

  const item = createItem({
    name: preset.name || '',
    catId: preset.catId ?? nav.catId ?? state.cats.find(c => !c.system)?.id ?? null,
    subId: preset.subId ?? (nav.subId && nav.subId !== OTHER ? nav.subId : null),
    img: blob,
    colors,
    source: preset.source || 'photo'
  });
  const saved = await openItemForm(item, true);
  return saved;
}

/**
 * Массовое добавление: изображения сохраняются как есть, без обработки,
 * в служебную категорию «Сортировка» — разбирать их пользователь будет потом.
 */
async function startBulkAdd(max = 10) {
  const files = await pickImageFiles(max);
  if (!files || !files.length) return;
  return importFiles(files);
}

async function importFiles(files) {
  const cat = sortingCat();

  let added = 0;
  for (const file of files) {
    busy(true, `Добавляю ${added + 1} из ${files.length}…`);
    try {
      const img = await downscaleBlob(file, 1600);
      await saveItem(createItem({ img, catId: cat?.id ?? null, source: 'bulk' }));
      added++;
    } catch (e) {
      console.warn('не удалось добавить', file.name, e);
    }
  }
  busy(false);

  if (!added) { toast('Не удалось прочитать изображения', 3200); return; }
  nav.all = false;
  nav.catId = cat?.id ?? null;
  nav.subId = null;
  emit();
  const skipped = files.length - added;
  toast(`Добавлено ${added} в «${cat?.name || 'гардероб'}»` + (skipped ? ` · пропущено ${skipped}` : ''), 3000);
}

async function startAddItem() {
  const src = await actionSheet('Добавить вещь', [
    { id: 'cam', icon: '📸', label: 'Сделать фото' },
    { id: 'file', icon: '🖼', label: 'Выбрать из галереи' },
    { id: 'bulk', icon: '🗃', label: 'Добавить несколько' }
  ]);
  if (!src) return;
  if (src === 'bulk') return startBulkAdd();
  const blob = src === 'cam' ? await captureFromCamera() : await pickImageFile();
  if (!blob) return;
  await addItemFlow(blob);
}

/* ---------- поля-списки и состав ---------- */
/**
 * Поле, значение которого выбирается из общего списка. Пустое не прячем:
 * пустая строка напоминает, что её стоит заполнить.
 */
function listField(label, key, getId, setId) {
  const btn = h('button', {
    class: 'btn block pick', onclick: async () => {
      const id = await openListPicker(key, { selected: getId() });
      if (id === null) return;
      setId(id || null);
      paint();
    }
  });
  const paint = () => {
    const name = entryName(key, getId());
    fill(btn, h('span', { class: name ? '' : 'muted' }, name || 'не указано'));
  };
  paint();
  return h('label', { class: 'field' }, h('span', {}, label), btn);
}

/**
 * Состав: строки добавляются по «+». Пустая строка под единственным материалом
 * ничего не напоминает — правильного их числа не существует.
 */
const MAX_PARTS = 7;
function compositionGroup(label, list) {
  const box = h('div', {});
  function paint() {
    fill(box,
      h('div', { class: 'section-title' }, label),
      list.map((part, i) => h('div', { class: 'row part-row' },
        h('button', {
          class: 'btn pick spacer', onclick: async () => {
            const id = await openListPicker('materials', { selected: part.id });
            if (!id) return;
            part.id = id;
            paint();
          }
        }, entryName('materials', part.id) || 'не указан'),
        h('input', {
          type: 'number', class: 'pct', min: '1', max: '100', step: '1',
          inputmode: 'numeric', placeholder: '%', value: part.pct ?? '',
          oninput: e => {
            const v = parseInt(e.target.value, 10);
            part.pct = Number.isFinite(v) ? Math.min(100, Math.max(1, v)) : null;
          }
        }),
        h('button', {
          class: 'icon-btn', title: 'Убрать',
          onclick: () => { list.splice(i, 1); paint(); }
        }, '✕')
      )),
      list.length < MAX_PARTS ? h('button', {
        class: 'btn block btn-add', onclick: async () => {
          const id = await openListPicker('materials', {});
          if (!id) return;
          list.push({ id, pct: null });
          paint();
        }

  paint();
  return box;
}

/**
 * Цвета вещи. Проставляются вручную: у человека своё видение цвета, и тот,
 * кто носит шартрез, ищет его как шартрез. Оттенки с фотографии идут
 * подсказкой при создании нового цвета палитры — не больше того.
 */
const MAX_COLORS = 5;
function colorsGroup(ids, suggest) {
  const box = h('div', {});

/* ---------- форма вещи ---------- */
function openItemForm(item, isNew = false) {
  return new Promise(res => {
    let resolved = false;
    // правим копии: отмена не должна оставлять следов в вещи
    const mat = {
      main: (item.material?.main || []).map(p => ({ ...p })),
      lining: (item.material?.lining || []).map(p => ({ ...p }))
    };
    let brandId = item.brandId || null;
    const colorIds = [...(item.colorIds || [])];
    // подсказка для новых цветов палитры — оттенки, снятые с этой фотографии
    const suggest = (item.colors || []).map(c => c.hex);

    const subSel = h('select', {});
    const catSel = h('select', {
      onchange: () => { item.catId = catSel.value; fillSubs(); }
    }, closetCats().map(c => h('option', { value: c.id, selected: c.id === item.catId }, c.name)));

    function fillSubs() {
      const cat = catById(catSel.value);
      fill(subSel,
        h('option', { value: '' }, '— без подкатегории —'),
        ...(cat?.subs || []).map(s => h('option', { value: s.id, selected: s.id === item.subId }, s.name))
      );
    }
    fillSubs();

    // Фотография правится отдельно от полей, но применяется вместе с ними:
    // пока форма открыта, «Отмена» обязана вернуть прежний снимок.
    let img = item.img;
    let colors = item.colors || [];

    const preview = h('div', {
      class: 'tile pick-photo', title: 'Изменить фотографию',
      style: { aspectRatio: '1', maxWidth: '190px', margin: '0 auto 12px', background: bgCss(item.bg) },
      onclick: () => photoMenu()
    }, h('img', { src: urlFor(img) }));

    async function applyPhoto(blob) {
      img = blob;
      preview.querySelector('img').src = urlFor(blob);
      try {
        colors = extractPalette(await imageFromBlob(blob), 5);
        // подсказки для новых цветов палитры берём уже с нового снимка
        suggest.splice(0, suggest.length, ...colors.map(c => c.hex));
      } catch (e) { console.warn(e); }
    }

    /**
     * Замена фотографии и переобработка — одно место: это две операции над
     * одним и тем же, и разводить их по разным кнопкам значит заставлять
     * выбирать до того, как человек увидел снимок.
     */
    async function photoMenu() {
      const act = await actionSheet('Фотография', [
        { id: 'cam', icon: '📸', label: 'Снять заново' },
        { id: 'file', icon: '🖼', label: 'Выбрать из галереи' },
        { id: 'crop', icon: '✂️', label: 'Переобработать текущую' }
      ]);
      if (!act) return;
      if (act === 'crop') {
        const blob = await openImageEditor(img, { autoAI: false });
        if (blob) await applyPhoto(blob);
        return;
      }
      const src = act === 'cam' ? await captureFromCamera() : await pickImageFile();
      if (!src) return;
      // новый снимок проходит тот же путь, что и при добавлении вещи:
      // та же обрезка и то же удаление фона
      const blob = await openImageEditor(src, { autoAI: true });
      if (blob) await applyPhoto(blob);
    }

    const bgRow = h('div', { class: 'palette-row' }, BGS.map(b =>
      h('button', {
        class: 'swatch' + (item.bg === b.id ? ' sel' : ''),
        style: { background: b.css, border: b.id === 'none' ? '1px dashed #bbb' : '' },
        title: b.name,
        onclick: e => {
          item.bg = b.id;
          preview.style.background = b.css;
          [...bgRow.children].forEach(x => x.classList.remove('sel'));
          e.currentTarget.classList.add('sel');
        }
      })
    ));

    const priceInput = h('input', {
      type: 'number', min: '0', step: '1', inputmode: 'numeric',
      placeholder: 'не указана', value: item.price?.value ?? ''
    });
    const curInput = h('input', {
      type: 'text', class: 'cur', maxlength: '4', value: item.price?.cur || lastCurrency()
    });
    const noteInput = h('textarea', { rows: '3', placeholder: 'не заполнен' }, item.note || '');

    const modal = openModal({
      title: isNew ? 'Новая вещь' : 'Редактировать',
      body: h('div', {},
        preview,
        h('div', { class: 'section-title' }, 'Фон карточки'), bgRow,
        h('label', { class: 'field' }, h('span', {}, 'Категория'), catSel),
        h('label', { class: 'field' }, h('span', {}, 'Подкатегория'), subSel),
        listField('Производитель', 'brands', () => brandId, v => { brandId = v; }),
        colorsGroup(colorIds, suggest),
        compositionGroup('Состав', mat.main),
        compositionGroup('Подкладка', mat.lining),
        h('label', { class: 'field' }, h('span', {}, 'Цена'),
          h('div', { class: 'row' }, priceInput, curInput)),
        h('label', { class: 'field' }, h('span', {}, 'Комментарий'), noteInput),
        h('button', {
          class: 'btn block', style: { marginTop: '14px' }, onclick: () => photoMenu()
        }, '🖼 Изменить фотографию')
      ),
      foot: [
        h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
        h('button', {
          class: 'btn primary', onclick: async () => {
            item.catId = catSel.value || null;
            item.subId = subSel.value || null;
            // значение списка могли удалить, пока форма была открыта
            const alive = (key, id) => (listEntry(key, id) ? id : null);
            item.brandId = alive('brands', brandId);
            item.colorIds = colorIds.filter(id => alive('colors', id));
            item.material = {
              main: mat.main.filter(p => alive('materials', p.id)),
              lining: mat.lining.filter(p => alive('materials', p.id))
            };
            const price = parseFloat(priceInput.value);
            item.price = Number.isFinite(price)
              ? { value: price, cur: curInput.value.trim() || lastCurrency() }
              : null;
            item.note = noteInput.value.trim();
            item.img = img;
            item.colors = colors;
            await saveItem(item);
            resolved = true;
            modal.close();
            toast(isNew ? 'Вещь добавлена' : 'Сохранено');
            res(item);
          }
        }, 'Сохранить')
      ],
      onClose: () => { if (!resolved) res(null); }
    });
  });
}

function openItemCard(item) {

        }, '↩ Из архива')

/* ---------- фильтрация ---------- */
function filteredItems(arc = nav.archive) {
  const f = filters(arc);
  let list = arc ? archivedItems() : closetItems();
  if (f.favOnly) list = list.filter(i => i.fav);
  if (f.color === NONE) list = list.filter(i => !(i.colorIds || []).length);
  else if (f.color) list = list.filter(i => (i.colorIds || []).includes(f.color));
  if (f.brand === NONE) list = list.filter(i => !i.brandId);
  else if (f.brand) list = list.filter(i => i.brandId === f.brand);
  // по основному составу и без оглядки на проценты: ищут «что у меня
  // шерстяного», а не «шерсть ровно восемьдесят»
  if (f.material === NONE) list = list.filter(i => !(i.material?.main || []).length);
  else if (f.material) {
    list = list.filter(i => (i.material?.main || []).some(p => p.id === f.material));
  }
  return list.sort(f.sort === 'old'
    ? (a, b) => a.createdAt - b.createdAt
    : (a, b) => b.createdAt - a.createdAt);
}

/* ---------- палитра гардероба ---------- */


/* ---------- менеджер категорий ---------- */
/** Один и тот же менеджер обслуживает гардероб и архив — разница только в scope. */
/**
 * Два пространства «Гардероба» для общего механизма категорий: сам гардероб
 * и архив вещей. Третье — образы — описано в своей вкладке.
 */
const space = arc => ({
  scope: arc ? SCOPE_ARCHIVE : SCOPE_CLOSET,
  title: arc ? 'Категории архива' : 'Категории',
  cats: () => arc ? archiveCats() : closetCats().filter(c => !c.system),
  n: nItems,
  thumb: c => thumbOf(latestIn(c.id, null, arc)),
  countSub: (cat, subId) => (arc ? archivedItems() : visibleItems())
    .filter(i => (arc ? i.arcSubId : i.subId) === subId).length,
  detachSub: async subId => {
    const touched = state.items.filter(i => (arc ? i.arcSubId : i.subId) === subId);
    touched.forEach(i => { arc ? (i.arcSubId = null) : (i.subId = null); });
    await saveItems(touched);
  },
  moveHint: 'Откройте её, нажмите «Выбрать» и переместите вещи — '
    + 'после этого категорию можно будет удалить.'
});

const openClosetCats = (scope = SCOPE_CLOSET) => openCategoryManager(space(scope === SCOPE_ARCHIVE));

/* ---------- навигация ---------- */
/**
 * Гардероб устроен как папки: список категорий → подкатегории → вещи.
 * nav.catId пуст — показываем категории; есть категория без подкатегории —
 * её подкатегории (или сразу вещи, если подкатегорий нет); есть обе — вещи.
 * nav.all — плоский список всех вещей с фильтрами по цвету и избранному.
 * nav.archive — то же дерево, но по архивным вещам и архивным категориям.
 */
const OTHER = '__other';
// отдельное значение фильтра: вещи, у которых это поле не заполнено
const NONE = '__none';
// высота закреплённой строки внизу — должна совпадать с .service-bar в стилях
const SERVICE_BAR_H = 42;
const nav = { all: false, archive: false, catId: null, subId: null, itemId: null };

const goRoot = () => { nav.all = false; nav.archive = false; nav.catId = null; nav.subId = null; nav.itemId = null; emit(); };
const goArchive = () => { nav.all = false; nav.archive = true; nav.catId = null; nav.subId = null; nav.itemId = null; emit(); };
const openCat = id => { nav.catId = id; nav.subId = null; emit(); };
const openSub = id => { nav.subId = id; emit(); };

const curCats = (arc = nav.archive) => arc ? archiveCats() : closetCats();
const curCat = (id, arc = nav.archive) => curCats(arc).find(c => c.id === id) || null;

/**
 * Вещи раздела. subId === OTHER — те, что лежат в категории без подкатегории;
 * catId === OTHER — вещи, которым не задана категория (бывает только в архиве).
 * Ссылка на удалённую подкатегорию считается отсутствующей: иначе вещь пропала бы
 * и из списка подкатегорий, и из «Другого», то есть из раздела целиком.
 */
function itemsIn(catId, subId, arc = nav.archive) {
  const want = catId === OTHER ? null : catId;
  const subs = new Set((curCat(want, arc)?.subs || []).map(s => s.id));
  const catOf = i => (arc ? i.arcCatId : i.catId) || null;
  const subOf = i => {
    const v = arc ? i.arcSubId : i.subId;
    return subs.has(v) ? v : null;
  };
  const pool = arc ? archivedItems() : visibleItems();
  return pool
    .filter(i => catOf(i) === want && (subId == null || (subId === OTHER ? !subOf(i) : subOf(i) === subId)))
    .sort((a, b) => b.createdAt - a.createdAt);
}

/** Последняя добавленная вещь раздела — её миниатюра стоит в строке списка. */
const latestIn = (catId, subId, arc) => itemsIn(catId, subId, arc)[0] || null;

/** Что показать в верхней панели: заголовок раздела и кнопку «назад». */
function closetNav() {
  if (nav.itemId) {
    const it = itemById(nav.itemId);
    if (it) return { title: itemLabel(it), back: closeCard };
  }
  if (nav.all) return nav.archive
    ? { title: 'Весь архив', back: goArchive }
    : { title: 'Все вещи', back: goRoot };
  if (nav.archive && !nav.catId) return { title: 'Архив вещей', back: goRoot };
  if (nav.archive && nav.catId === OTHER) return { title: 'Другое', back: goArchive };

  const cat = curCat(nav.catId);
  if (!cat) return null;
  const up = nav.archive ? goArchive : goRoot;
  // Подкатегории настраиваются изнутри своей категории — и у гардероба,
  // и у архива. Исключение «Сортировка»: это временная стопка, её разбирают,
  // а не обустраивают. Названия рабочих полок не меняются, как и у архива
  if (!nav.subId) {
    return {
      title: cat.name, back: up,
      action: cat.system === 'sorting' ? null : {
        icon: '📂', title: 'Подкатегории',
        onclick: () => openSubManager(space(nav.archive), cat, emit)
      }
    };
  }
  const name = nav.subId === OTHER ? 'Другое' : subById(cat.id, nav.subId)?.name;
  return { title: name || cat.name, back: () => { nav.subId = null; emit(); } };
}

/* ---------- архив ---------- */
/**
 * Архив — пометка на вещи, а не категория: платье остаётся платьем и при
 * возврате встаёт на своё прежнее место в гардеробе. Из уже собранных образов
 * архивная вещь не исчезает, иначе календарь перестал бы соответствовать тому,
 * что было надето.
 */
async function archiveItem(item) {
  const cats = archiveCats();
  // пока архивных категорий нет, не спрашиваем ни о чём: вещь уходит в архив
  // как есть, разложить её можно будет потом, уже внутри архива
  if (cats.length) {
    const dest = await pickDestination(true);
    if (!dest) return false;
    item.arcCatId = dest.catId;
    item.arcSubId = dest.subId;
  } else {
    item.arcCatId = null;
    item.arcSubId = null;
  }
  item.archived = true;
  await saveItem(item);
  toast('Перемещено в архив');
  return true;
}

async function unarchiveItem(item) {
  item.archived = false;
  item.arcCatId = null;
  item.arcSubId = null;
  // категории могло не стать, пока вещь лежала в архиве
  if (!catById(item.catId)) {
    const sorting = sortingCat();
    item.catId = sorting?.id || null;
    item.subId = null;
    await saveItem(item);
    toast(`Категории больше нет — вещь в «${sorting?.name || 'гардеробе'}»`, 3400);
    return;
  }
  await saveItem(item);
  toast('Возвращено из архива');
}

/* ---------- множественный выбор ---------- */
/**
 * Выделение работает только внутри раздела, где видно, куда вещь положена.
 * В «Все вещи» его нет намеренно: там вещь вырвана из контекста, и перенос
 * вслепую слишком легко сделать не туда. Удаления здесь тоже нет — только
 * перенос, который всегда можно повторить.
 */
let selection = null;      // Set с id, пока режим включён
let selectionKey = null;   // раздел, в котором его включили

const sectionKey = () => `${nav.archive ? 'a' : 'c'}/${nav.catId || ''}/${nav.subId || ''}`;
const selectionOn = () => {
  if (selection && selectionKey !== sectionKey()) selection = null;
  return !!selection;
};
function toggleSelection(on) {
  selection = on ? new Set() : null;
  selectionKey = sectionKey();
  emit();
}

/** Куда переместить: сначала категория, затем её подкатегория. */
function pickDestination(arc = nav.archive) {
  return new Promise(res => {
    let done = false;
    const body = h('div', {});
    const finish = v => { done = true; res(v); modal.close(); };
    const modal = openModal({
      title: arc ? 'Куда в архиве' : 'Переместить в…', body, full: true,
      onClose: () => { if (!done) res(null); }
    });

    const showCats = () => fill(body,
      h('div', { class: 'list' },
        ...curCats(arc).map(c => navRow({
          thumb: latestIn(c.id, null, arc), title: c.name,
          note: c.subs.length
            ? plural(c.subs.length, 'подкатегория', 'подкатегории', 'подкатегорий')
            : nItems(itemsIn(c.id, null, arc).length),
          onclick: () => c.subs.length ? showSubs(c) : finish({ catId: c.id, subId: null })
        })),
        // в архиве вещь имеет право лежать вообще без категории
        arc ? navRow({
          thumb: latestIn(OTHER, null, true), title: 'Без категории', muted: true,
          note: 'в корень архива, в «Другое»',
          onclick: () => finish({ catId: null, subId: null })
        }) : null
      )
    );

    const showSubs = cat => fill(body,
      h('button', { class: 'btn btn-sm', onclick: showCats }, '‹ Все категории'),
      h('div', { class: 'section-title' }, cat.name),
      h('div', { class: 'list' },
        ...cat.subs.map(s => navRow({
          thumb: latestIn(cat.id, s.id, arc), title: s.name,
          note: nItems(itemsIn(cat.id, s.id, arc).length),
          onclick: () => finish({ catId: cat.id, subId: s.id })
        })),
        navRow({
          title: 'Без подкатегории', muted: true,
          note: 'в саму категорию, в «Другое»',
          onclick: () => finish({ catId: cat.id, subId: null })
        })
      )
    );

    showCats();
  });
}

async function moveSelected() {
  const arc = nav.archive;
  const dest = await pickDestination(arc);
  if (!dest) return;
  const items = [...selection].map(itemById).filter(Boolean);
  items.forEach(it => {
    if (arc) { it.arcCatId = dest.catId; it.arcSubId = dest.subId; }
    else { it.catId = dest.catId; it.subId = dest.subId; }
  });
  selection = null;                 // гасим режим до сохранения: оно перерисует экран
  await saveItems(items);
  const cat = dest.catId ? curCat(dest.catId, arc) : null;
  const sub = dest.subId ? subById(dest.catId, dest.subId) : null;
  toast(`${nItems(items.length)} → ${cat ? cat.name : 'без категории'}${sub ? ' › ' + sub.name : ''}`, 3000);
}

/* ---------- рендер вкладки ---------- */

/**
 * Строка списка: миниатюра, название, пояснение, стрелка вправо.
 * Пока в разделе нет вещей, миниатюра остаётся пустой — подставлять вместо неё
 * значок незачем, гардероб наполняют фотографии, а не пиктограммы.
 */
const thumbOf = item => item
  ? h('img', { class: 'thumb', src: urlFor(item.img), style: { background: bgCss(item.bg) } })
  : h('div', { class: 'thumb ph' });

function navRow({ thumb, thumbNode, title, note, muted, onclick }) {
  return h('div', { class: 'lrow nav' + (muted ? ' soft' : ''), onclick },
    thumbNode || thumbOf(thumb),
    h('div', { class: 't' }, h('b', {}, title), note ? h('span', {}, note) : null),
    h('span', { class: 'chev' }, '›')
  );
}

/**
 * Миниатюра «Всех вещей» — мозаика из четырёх последних добавленных.
 * Одна фотография повторяла бы картинку соседней строки.
 */
/** Мозаика из четырёх последних. pic — где лежит картинка: у вещи это img,
 *  у образа preview, поэтому источник передаётся снаружи. */
function collageThumb(list, pic = it => it.img) {
  const four = list.slice(0, 4);
  if (!four.length) return h('div', { class: 'thumb ph' });
  return h('div', { class: 'thumb grid4' },
    four.map(it => h('img', { src: urlFor(pic(it)), style: { background: bgCss(it.bg) } })));
}

/** Закреплённая внизу строка: рабочие полки, которые не должны уезжать. */
function serviceBar({ icon, title, count, onclick }) {
  return h('div', { class: 'service-bar', onclick },
    h('span', {}, icon),
    h('b', { class: 'spacer' }, title),
    count ? h('span', { class: 'muted' }, count) : null,
    h('span', { class: 'muted' }, '›')
  );
}

/** Первый уровень гардероба: все вещи, служебные категории, затем обычные. */
function renderRoot(root) {
  const order = ['sorting', 'review'];
  const cats = closetCats();
  const system = cats.filter(c => c.system)
    .sort((a, b) => order.indexOf(a.system) - order.indexOf(b.system));
  const rest = cats.filter(c => !c.system).sort((a, b) => a.order - b.order);
  const archived = archivedItems().length;

  // «Сортировка», «На рассмотрении» и архив — рабочие полки, а не гардероб.
  // Они закреплены внизу: при листании категорий их место не меняется.
  // Архив показывается всегда, даже пустой: это часть устройства гардероба,
  // а не следствие того, что в нём что-то лежит. Полка, появляющаяся только
  // после первой архивации, читается как пропажа — и о самой возможности
  // убрать вещь, не удаляя, узнать неоткуда.
  const bars = [
    ...system.map(c => serviceBar({
      icon: c.icon, title: c.name, count: countInCat(c.id), onclick: () => openCat(c.id)
    })),
    serviceBar({ icon: '📦', title: 'Архив вещей', count: archived, onclick: goArchive })
  ];
  const barsH = bars.length * SERVICE_BAR_H + 1;

  fill(root,
    h('div', { class: 'list' },
      navRow({
        thumbNode: collageThumb(closetItems()), title: 'Все вещи',
        note: nItems(closetItems().length),
        onclick: () => { nav.all = true; emit(); }
      }),
      ...rest.map(c => navRow({
        thumb: latestIn(c.id, null, false), title: c.name,
        note: nItems(countInCat(c.id))
          + (c.subs.length ? ' · ' + plural(c.subs.length, 'подкатегория', 'подкатегории', 'подкатегорий') : ''),
        onclick: () => openCat(c.id)
      }))
    ),
    h('button', {
      class: 'btn block ghost', style: { marginTop: '14px' }, onclick: () => openClosetCats()
    }, '⚙️ Управление категориями'),

    h('div', { class: 'pinned-bottom' }, bars),

    h('button', {
      class: 'fab', style: { bottom: `calc(var(--tabh) + ${barsH + 14}px)` },
      onclick: startAddItem, title: 'Добавить вещь'
    }, '+')
  );
  // запас, чтобы «Управление категориями» не оказалось под круглой кнопкой
  root.style.paddingBottom = barsH + 74 + 'px';
}

/** Первый уровень архива: его собственные категории плюс «Другое». */
function renderArchiveRoot(root) {
  const cats = archiveCats().sort((a, b) => a.order - b.order);
  const loose = itemsIn(OTHER, null, true).length;

  fill(root,
    cats.length || loose ? h('div', { class: 'list' },
      // как «Все вещи» в гардеробе: плоский список с фильтрами,
      // чтобы вещь находилась и тогда, когда забыто, в какой она категории
      navRow({
        thumbNode: collageThumb(archivedItems()), title: 'Весь архив',
        note: nItems(archivedItems().length),
        onclick: () => { nav.all = true; emit(); }
      }),
      ...cats.map(c => navRow({
        thumb: latestIn(c.id, null, true), title: c.name,
        note: nItems(countInArcCat(c.id))
          + (c.subs.length ? ' · ' + plural(c.subs.length, 'подкатегория', 'подкатегории', 'подкатегорий') : ''),
        onclick: () => openCat(c.id)
      })),
      loose ? navRow({
        thumb: latestIn(OTHER, null, true), title: 'Другое', muted: true,
        note: nItems(loose) + ' без категории',
        onclick: () => openCat(OTHER)
      }) : null
    ) : h('div', { class: 'empty' },
      h('div', { class: 'big' }, '📦'),
      h('p', {}, 'Архив пуст. Вещи попадают сюда из карточки — «В архив».')),

    cats.length || loose ? h('button', {
      class: 'btn block ghost', style: { marginTop: '14px' },
      onclick: () => openClosetCats(SCOPE_ARCHIVE)
    }, '⚙️ Категории архива') : null
  );
  root.style.paddingBottom = '';
}

/** Второй уровень: подкатегории. «Другое» появляется само, когда есть что показать. */
function renderCat(root, cat) {
  const loose = itemsIn(cat.id, OTHER).length;

  fill(root,
    h('div', { class: 'list' },
      ...cat.subs.map(s => navRow({
        thumb: latestIn(cat.id, s.id), title: s.name,
        note: nItems(itemsIn(cat.id, s.id).length),
        onclick: () => openSub(s.id)
      })),
      // служебная строка: не хранится, не переименовывается, исчезает сама
      loose ? navRow({
        thumb: latestIn(cat.id, OTHER), title: 'Другое', muted: true,
        note: nItems(loose) + ' без подкатегории',
        onclick: () => openSub(OTHER)
      }) : null
    ),
    nav.archive ? null : h('button', { class: 'fab', onclick: startAddItem, title: 'Добавить вещь' }, '+')
  );
  root.style.paddingBottom = '';
}

const itemTile = (it, selectable = false) => {
  const picked = selectable && selection.has(it.id);
  return h('div', {
    class: 'tile' + (picked ? ' sel' : ''), style: { background: bgCss(it.bg) },
    onclick: () => {
      if (!selectable) return openItemCard(it);
      picked ? selection.delete(it.id) : selection.add(it.id);
      emit();
    }
  },
    h('img', { src: urlFor(it.img), alt: itemLabel(it) }),
    it.fav && !selectable ? h('span', { class: 'fav' }, '★') : null,
    selectable ? h('span', { class: 'check' + (picked ? ' on' : '') }, picked ? '✓' : '') : null,
    it.brandId ? h('span', { class: 'lbl' }, entryName('brands', it.brandId)) : null
  );
};

/** Сетка вещей раздела — единственное место, где работает множественный выбор. */
function renderItems(root, list, emptyText) {
  const on = selectionOn();
  const all = on && list.length && list.every(i => selection.has(i.id));

  fill(root,
    h('div', { class: 'row', style: { margin: '2px 0 8px' } },
      h('span', { class: 'small muted spacer' }, on ? `Выбрано ${selection.size}` : nItems(list.length)),
      list.length ? h('button', {
        class: 'btn btn-sm', onclick: () => toggleSelection(!on)
      }, on ? 'Отмена' : 'Выбрать') : null
    ),

    list.length ? h('div', { class: 'grid' }, list.map(it => itemTile(it, on))) : h('div', { class: 'empty' },
      h('div', { class: 'big' }, '🧺'),
      h('p', {}, emptyText)),

    on ? h('div', { class: 'select-bar' },
      h('button', {
        class: 'btn btn-sm', onclick: () => {
          selection = all ? new Set() : new Set(list.map(i => i.id));
          emit();
        }
      }, all ? 'Снять все' : 'Выбрать все'),
      h('span', { class: 'spacer' }),
      h('button', {
        class: 'btn btn-sm btn-add', disabled: !selection.size, onclick: moveSelected
      }, 'Переместить в…')
    ) : null,

    on || nav.archive ? null : h('button', { class: 'fab', onclick: startAddItem, title: 'Добавить вещь' }, '+')
  );
  root.style.paddingBottom = on ? '140px' : '';
}

/**
 * «Все вещи»: единственное место с фильтрами. Все они устроены одинаково —
 * именованный чип открывает тот же список, что и в карточке, выбранное
 * написано прямо в чипе. Сортировка стоит отдельно и только сортирует:
 * «по производителю» ничего не находит, а лишь расставляет по алфавиту.
 */
function renderAll(root) {
  const arc = nav.archive;
  const f = filters(arc);
  const list = filteredItems(arc);
  const pool = arc ? archivedItems() : closetItems();
  const set = (field, v) => { f[field] = v; emit(); };

  // «без …» показываем, только когда такие вещи есть: иначе это пустая строка
  const blanks = {
    color: pool.filter(i => !(i.colorIds || []).length).length,
    brand: pool.filter(i => !i.brandId).length,
    material: pool.filter(i => !(i.material?.main || []).length).length
  };

  const filterChip = (label, field, key, noneLabel) => {
    const id = f[field];
    const name = id === NONE ? noneLabel.toLowerCase() : id ? entryName(key, id) : null;
    return h('button', {
      class: 'chip' + (name ? ' active' : ''),
      onclick: async () => {
        const v = await openListPicker(key, {
          selected: id, title: label,
          first: blanks[field] ? { id: NONE, name: noneLabel } : null
        });
        if (v !== null) set(field, v || null);
      }
    },
      id && id !== NONE && key === 'colors'
        ? h('span', { class: 'dot', style: { background: listEntry('colors', id)?.hex } }) : null,
      name ? `${label}: ${name}` : label,
      name ? h('span', {
        class: 'x', onclick: e => { e.stopPropagation(); set(field, null); }
      }, '✕') : null
    );
  };

  const filterRow = h('div', { class: 'chips filters' },
    filterChip('Цвет', 'color', 'colors', 'Без цвета'),
    filterChip('Производитель', 'brand', 'brands', 'Без производителя'),
    filterChip('Материал', 'material', 'materials', 'Без материала'),
    h('button', {
      class: 'chip' + (f.favOnly ? ' active' : ''),
      onclick: () => set('favOnly', !f.favOnly)
    }, '★ Избранное')
  );

  const controls = h('div', { class: 'row', style: { margin: '6px 0 4px' } },
    h('span', { class: 'small muted spacer' }, nItems(list.length)),
    h('select', {
      style: { width: 'auto', padding: '5px 8px', fontSize: '12px' },
      onchange: e => set('sort', e.target.value)
    },
      [['new', 'Сначала новые'], ['old', 'Сначала старые']]
        .map(([v, t]) => h('option', { value: v, selected: f.sort === v }, t)))
  );

  fill(root, filterRow, controls,
    list.length ? h('div', { class: 'grid' }, list.map(it => itemTile(it))) : h('div', { class: 'empty' },
      h('div', { class: 'big' }, arc ? '📦' : '🧺'),
      h('p', {}, pool.length
        ? 'Ничего не найдено по фильтрам'
        : arc
          ? 'Архив пуст.'
          : 'Гардероб пуст. Чтобы добавить вещи, нажмите «+» внизу справа.')),
    arc ? null : h('button', { class: 'fab', onclick: startAddItem, title: 'Добавить вещь' }, '+')
  );
  root.style.paddingBottom = '';
}

function renderCloset(root) {
  // карточка вещи лежит поверх любого раздела: возврат ведёт туда, откуда открыли
  if (nav.itemId) {
    const it = itemById(nav.itemId);
    if (it) return renderItemCard(root, it);
    nav.itemId = null;
  }
  if (nav.all) return renderAll(root);
  if (nav.archive && !nav.catId) return renderArchiveRoot(root);
  // «Другое» существует, только пока в нём что-то есть: разложили всё —
  // возвращаемся на уровень выше, а не смотрим на пустой экран
  if (nav.archive && nav.catId === OTHER) {
    const loose = itemsIn(OTHER, null, true);
    if (!loose.length) { nav.catId = null; return renderArchiveRoot(root); }
    return renderItems(root, loose, 'Здесь пусто.');
  }

  const cat = curCat(nav.catId);
  if (!cat) {
    nav.catId = null;
    nav.subId = null;
    return nav.archive ? renderArchiveRoot(root) : renderRoot(root);
  }

  // подкатегории показываем только там, где они есть
  if (!nav.subId) {
    return cat.subs.length
      ? renderCat(root, cat)
      : renderItems(root, itemsIn(cat.id), nav.archive
        ? `В разделе «${cat.name}» пока пусто.`
        : `В разделе «${cat.name}» пока пусто. Нажмите «+» внизу справа.`);
  }
  const list = itemsIn(cat.id, nav.subId);
  if (nav.subId === OTHER && !list.length) { nav.subId = null; return renderCat(root, cat); }
  const name = nav.subId === OTHER ? 'Другое' : subById(cat.id, nav.subId)?.name || cat.name;
  renderItems(root, list, `В разделе «${name}» пока пусто.`);
}

/* ===== outfits.js ===== */
// Вкладка «Образы»: папки с категориями, редактор образа на Konva, рандомайзер.
import {
  fill, h, qs, urlFor, toast, openModal, confirmDialog, promptDialog, actionSheet, busy,
  plural, nItems, nOutfits
} from './ui.js';
import {
  state, saveOutfit, deleteOutfit, outfitById, itemById, visibleItems, emit,
  catById, subById, outfitCats, countInOutfitCat, SCOPE_OUTFIT,
  outfitItems, archivedInOutfit
} from './state.js';

const SW = 640, SH = 860;           // логический размер холста образа

const dataURLtoBlob = url => fetch(url).then(r => r.blob());

/* ---------- редактор образа ---------- */
async function openOutfitEditor(existing, isCopy = false) {
  const outfit = existing
    ? JSON.parse(JSON.stringify({ ...existing, preview: null }))
    : {
      id: uid('of'), name: '', bg: 'cream', layers: [], createdAt: Date.now(),
      // образ ложится в ту папку, из которой его начали собирать
      catId: nav.catId === OTHER ? null : nav.catId, subId: nav.subId === OTHER ? null : nav.subId
    };

  const host = h('div', { id: 'stage-host' });
  const toolbar = h('div', { class: 'tools' });
  const opts = h('div', { class: 'tool-opts' });

  // редактор отдаёт сохранённый образ наружу: календарю нужно положить
  // на день именно копию, которую пользователь только что собрал
  let settle;
  const done = new Promise(r => { settle = r; });

  const modal = openModal({
    title: !existing || isCopy ? 'Новый образ' : 'Редактировать образ',
    full: true,
    body: h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', margin: '-12px' } }, host, opts, toolbar),
    onClose: () => settle(saved),
    foot: [
      h('button', { class: 'btn', onclick: () => modal.close() }, 'Отмена'),
      h('button', { class: 'btn primary', onclick: save }, 'Сохранить')
    ],
    onClose: () => stage && stage.destroy()
  });

  await new Promise(r => setTimeout(r, 30));   // ждём вёрстку, чтобы знать размеры host

  const stage = new Konva.Stage({ container: host, width: SW, height: SH });
  const layer = new Konva.Layer();
  stage.add(layer);

  const bgRect = new Konva.Rect({ x: 0, y: 0, width: SW, height: SH, listening: false });
  layer.add(bgRect);
  applyBg(outfit.bg);

  const tr = new Konva.Transformer({
    rotateEnabled: true, keepRatio: true, borderStroke: '#c1785c', anchorStroke: '#c1785c',
    anchorSize: 14, enabledAnchors: ['top-left', 'top-right', 'bottom-left', 'bottom-right']
  });
  layer.add(tr);

  function fit() {
    const r = host.getBoundingClientRect();
    const s = Math.min(r.width / SW, r.height / SH) * 0.96;
    stage.width(SW * s); stage.height(SH * s); stage.scale({ x: s, y: s });
    stage.batchDraw();
    return s;
  }
  let viewScale = fit();
  const onResize = () => { viewScale = fit(); };
  window.addEventListener('resize', onResize);

  function applyBg(id) {
    outfit.bg = id;
    const b = bgById(id);
    if (b.colors.length > 1) {
      bgRect.fillPriority('linear-gradient');
      bgRect.fillLinearGradientStartPoint({ x: 0, y: 0 });
      bgRect.fillLinearGradientEndPoint({ x: SW, y: SH });
      bgRect.fillLinearGradientColorStops([0, b.colors[0], 1, b.colors[1]]);
    } else {
      bgRect.fillPriority('color');
      bgRect.fill(b.colors[0]);
    }
    layer.batchDraw();
  }

  stage.on('pointerdown', e => {
    if (e.target === stage || e.target === bgRect) tr.nodes([]);
    else if (e.target.getClassName() === 'Image') tr.nodes([e.target]);
    layer.batchDraw();
  });

  async function addItemNode(itemId, pose) {
    const it = itemById(itemId);
    if (!it) return null;
    const img = await imageFromBlob(it.img);
    const natural = Math.max(img.naturalWidth, img.naturalHeight);
    const target = SH * 0.34;
    const base = target / natural;
    const node = new Konva.Image({
      image: img, draggable: true,
      offsetX: img.naturalWidth / 2, offsetY: img.naturalHeight / 2,
      x: pose?.x ?? SW / 2, y: pose?.y ?? SH / 2,
      scaleX: pose?.scaleX ?? base, scaleY: pose?.scaleY ?? base,
      rotation: pose?.rotation ?? 0,
      shadowColor: 'rgba(0,0,0,.25)', shadowBlur: 18, shadowOffsetY: 6, shadowOpacity: .5
    });
    node.setAttr('itemId', itemId);
    layer.add(node);
    tr.moveToTop();
    layer.batchDraw();
    return node;
  }

  // восстановление сохранённого образа
  for (const l of outfit.layers) await addItemNode(l.itemId, l);

  async function addItems() {
    const ids = await pickItems({ title: 'Добавить в образ' });
    if (!ids || !ids.length) return;
    let i = 0;
    for (const id of ids) {
      const n = await addItemNode(id, { x: SW / 2 + (i % 2 ? 70 : -70), y: SH * (0.25 + 0.22 * Math.floor(i / 2)) });
      i++;
      if (n) tr.nodes([n]);
    }
    layer.batchDraw();
  }

  async function randomize() {
    const byCat = new Map();
    for (const it of visibleItems()) {
      if (!it.catId) continue;
      if (!byCat.has(it.catId)) byCat.set(it.catId, []);
      byCat.get(it.catId).push(it);
    }
    if (!byCat.size) return toast('Сначала добавьте вещи');
    layer.find('Image').forEach(n => n.destroy());
    tr.nodes([]);
    const cats = [...byCat.keys()].sort(() => Math.random() - .5).slice(0, 3);
    let i = 0;
    for (const c of cats) {
      const pool = byCat.get(c);
      const it = pool[Math.floor(Math.random() * pool.length)];
      await addItemNode(it.id, { y: SH * (0.22 + 0.27 * i), x: SW / 2 });
      i++;
    }
    layer.batchDraw();
    toast('Случайный образ');
  }

  function selected() { return tr.nodes()[0] || null; }

  const TOOLS = [
    { ic: '➕', label: 'Вещи', fn: addItems },
    { ic: '🎨', label: 'Фон', fn: () => showBgPicker() },
    { ic: '🎲', label: 'Случайно', fn: randomize },
    { ic: '⬆️', label: 'Выше', fn: () => { selected()?.moveUp(); tr.moveToTop(); layer.batchDraw(); } },
    { ic: '⬇️', label: 'Ниже', fn: () => { const n = selected(); if (n) { n.moveDown(); if (n.zIndex() < 1) n.zIndex(1); } layer.batchDraw(); } },
    { ic: '🗑', label: 'Убрать', fn: () => { const n = selected(); if (n) { n.destroy(); tr.nodes([]); layer.batchDraw(); } } }
  ];
  fill(toolbar, ...TOOLS.map(t =>
    h('button', { class: 'tool', onclick: t.fn }, h('span', { class: 'ic' }, t.ic), h('span', {}, t.label))));

  function showBgPicker() {
    fill(opts, h('div', { class: 'palette-row' }, BGS.map(b =>
      h('button', {
        class: 'swatch' + (outfit.bg === b.id ? ' sel' : ''),
        style: { background: b.css },
        onclick: e => { applyBg(b.id); [...e.currentTarget.parentNode.children].forEach(x => x.classList.remove('sel')); e.currentTarget.classList.add('sel'); }
      })
    )));
  }
  fill(opts, h('div', { class: 'muted small' }, 'Тапните вещь, чтобы двигать, вращать и менять размер.'));

  let saved = null;

  async function save() {
    const nodes = layer.find('Image');
    if (!nodes.length) return toast('Добавьте хотя бы одну вещь');
    outfit.layers = nodes.map(n => ({
      itemId: n.getAttr('itemId'), x: n.x(), y: n.y(),
      scaleX: n.scaleX(), scaleY: n.scaleY(), rotation: n.rotation()
    }));
    tr.nodes([]); layer.batchDraw();

    // Названия здесь не спрашиваем. Оно необязательно и правится в карточке,
    // а запрос показывался из-под «занято»: окно было видно, но недоступно —
    // приложение выглядело зависшим.
    busy(true, 'Сохраняю образ…');
    try {
      const url = stage.toDataURL({ pixelRatio: 1 / viewScale });
      outfit.preview = await dataURLtoBlob(url);
      await saveOutfit(outfit);
      saved = outfit;
    } catch (e) {
      console.error(e);
      toast('Не удалось сохранить образ');
      return;
    } finally {
      busy(false);          // что бы ни случилось, экран не остаётся занятым
    }
    window.removeEventListener('resize', onResize);
    modal.close();
    toast('Образ сохранён');
  }

  return done;
}

/* ---------- пространство категорий образов ---------- */
/**
 * Третье пространство категорий — своё, отдельное и от гардеробных,
 * и от архивных. Механизм общий, отличаются только списки и счётчики.
 */
const outfitSpace = {
  scope: SCOPE_OUTFIT,
  title: 'Категории образов',
  cats: () => outfitCats(),
  n: nOutfits,
  thumb: c => previewOf(latestOutfit(c.id, null)),
  countSub: (cat, subId) => state.outfits.filter(o => o.subId === subId).length,
  detachSub: async subId => {
    for (const o of state.outfits.filter(x => x.subId === subId)) {
      o.subId = null;
      await saveOutfit(o);
    }
  },
  moveHint: 'Перенесите их в другую категорию — после этого её можно будет удалить.'
};

/* ---------- навигация по папкам ---------- */
/**
 * Устроено как «Гардероб»: список категорий → подкатегории → образы.
 * «Другое» появляется само, когда в категории есть образы без подкатегории.
 */
const nav = { all: false, catId: null, subId: null, outfitId: null };

const goRoot = () => { nav.all = false; nav.catId = null; nav.subId = null; nav.outfitId = null; emit(); };
const openCat = id => { nav.catId = id; nav.subId = null; emit(); };
const catOf = id => outfitCats().find(c => c.id === id) || null;

/** Образы раздела. Ссылка на удалённую подкатегорию считается отсутствующей. */
function outfitsIn(catId, subId) {
  const want = catId === OTHER ? null : catId;
  const subs = new Set((catOf(want)?.subs || []).map(s => s.id));
  const subOf = o => (subs.has(o.subId) ? o.subId : null);
  return state.outfits
    .filter(o => (o.catId || null) === want
      && (subId == null || (subId === OTHER ? !subOf(o) : subOf(o) === subId)))
    .sort((a, b) => b.createdAt - a.createdAt);
}
const latestOutfit = (catId, subId) => outfitsIn(catId, subId)[0] || null;

function outfitsNav() {
  if (nav.outfitId) {
    const o = outfitById(nav.outfitId);
    if (o) return { title: o.name || 'Образ', back: closeCard };
  }
  if (nav.all) return { title: 'Все образы', back: goRoot };
  // «Другое» — не настоящая категория, своего заголовка у неё иначе не будет
  if (nav.catId === OTHER) return { title: 'Другое', back: goRoot };
  const cat = catOf(nav.catId);
  if (!cat) return null;
  if (!nav.subId) {
    return {
      title: cat.name, back: goRoot,
      action: { icon: '📂', title: 'Подкатегории', onclick: () => openSubManager(outfitSpace, cat, emit) }
    };
  }
  const name = nav.subId === OTHER ? 'Другое' : cat.subs.find(s => s.id === nav.subId)?.name;
  return { title: name || cat.name, back: () => { nav.subId = null; emit(); } };
}

/* ---------- карточка образа ---------- */
const closeCard = () => { nav.outfitId = null; emit(); };

/**
 * Называем архивные вещи по производителю — но только те, у кого он есть.
 * Иначе в строку попадала бы гардеробная категория вроде «Сортировка»,
 * и выходило бы «в архиве: Сортировка».
 */
function goneText(gone) {
  const named = gone.filter(i => i.brandId).map(itemLabel);
  return `${nItems(gone.length)} из этого образа в архиве`
    + (named.length === gone.length ? `: ${named.join(', ')}` : '');
}

const previewOf = o => o
  ? h('img', { class: 'thumb', src: urlFor(o.preview), style: { background: bgCss(o.bg) } })
  : h('div', { class: 'thumb ph' });

function renderOutfitCard(root, o) {
  const items = outfitItems(o);
  const gone = archivedInOutfit(o);
  const cat = catById(o.catId);
  const place = [cat?.name, subById(o.catId, o.subId)?.name].filter(Boolean).join(' › ') || 'Без категории';

  fill(root,
    h('div', { class: 'card-photo tall', style: { background: bgCss(o.bg) } },
      h('img', { src: urlFor(o.preview), alt: o.name || 'Образ' })),

    // название образа больше негде поменять: редактор спрашивает его только
    // один раз, при первом сохранении
    h('div', { class: 'lrow' },
      h('div', { class: 't' },
        h('b', { class: o.name ? '' : 'muted' }, o.name || 'без названия'),
        h('span', {}, place)),
      h('button', {
        class: 'btn btn-sm', title: 'Название', onclick: async () => {
          const n = await promptDialog('Название образа', o.name || '', 'Название', true);
          if (n === null) return;
          o.name = n;
          await saveOutfit(o);
        }
      }, '✎')),

    // вещь, ушедшая в архив, образ не портит — но знать об этом нужно до того,
    // как образ попадёт в календарь и добавит ей носку, которой не было
    gone.length ? h('p', { class: 'warn-line' }, goneText(gone)) : null,

    h('div', { class: 'section-title' }, 'Вещи в образе'),
    items.length ? h('div', { class: 'grid' }, items.map(it => h('div', {
      class: 'tile' + (it.archived ? ' gone' : ''), style: { background: bgCss(it.bg) },
      onclick: () => { closeCard(); openItemCard(it); }
    }, h('img', { src: urlFor(it.img) }))))
      : h('p', { class: 'muted small' }, 'Вещей из гардероба в образе не осталось.'),

    h('div', { class: 'card-actions' },
      h('button', {
        class: 'btn', onclick: async () => {
          const dest = await pickOutfitPlace();
          if (!dest) return;
          o.catId = dest.catId; o.subId = dest.subId;
          await saveOutfit(o);
          toast('Перемещено');
        }
      }, '📂 В категорию'),
      h('button', { class: 'btn', onclick: () => copyOutfit(o) }, '⧉ Копия'),
      h('button', { class: 'btn', onclick: () => openOutfitEditor(o) }, '✎ Изменить'),
      h('button', { class: 'btn danger', onclick: () => removeOutfit(o) }, '🗑')
    )
  );
  root.style.paddingBottom = '';
}

/* ---------- копия и удаление ---------- */
/**
 * Копия — не удобство, а необходимость: вариант с другой обувью это
 * отдельный образ, и собирать его с нуля никто не станет. Копия сразу
 * открывается в редакторе и сама не сохраняется.
 */
function copyOutfit(o, drop = []) {
  const copy = {
    ...JSON.parse(JSON.stringify({ ...o, preview: null })),
    id: uid('of'),
    name: o.name ? o.name + ' — копия' : '',
    createdAt: Date.now()
  };
  if (drop.length) copy.layers = copy.layers.filter(l => !drop.includes(l.itemId));
  nav.outfitId = null;
  return openOutfitEditor(copy, true);
}

async function removeOutfit(o) {
  const days = state.calendar.filter(d => (d.outfitIds || []).includes(o.id)).length;
  const text = days
    ? `Образ использован в ${plural(days, 'дне', 'днях', 'днях')} календаря. Удалить вместе с записями?`
    : 'Удалить образ?';
  if (!await confirmDialog(text)) return;
  closeCard();
  await deleteOutfit(o.id);
  toast(days ? 'Образ и записи удалены' : 'Образ удалён');
}

/** Куда положить образ: категория и подкатегория, обе необязательны. */
function pickOutfitPlace() {
  return new Promise(res => {
    let done = false;
    const body = h('div', { class: 'list' });
    const modal = openModal({ title: 'Куда положить', body, onClose: () => { if (!done) res(null); } });
    const finish = v => { done = true; res(v); modal.close(); };

    function render(cat) {
      if (!cat) {
        return fill(body,
          ...outfitCats().map(c => h('div', {
            class: 'lrow nav', onclick: () => c.subs.length ? render(c) : finish({ catId: c.id, subId: null })
          }, h('div', { class: 't' }, h('b', {}, c.name)), h('span', { class: 'chev' }, '›'))),
          h('div', {
            class: 'lrow nav soft', onclick: () => finish({ catId: null, subId: null })
          }, h('div', { class: 't' }, h('b', {}, 'Без категории'))),
          outfitCats().length ? null : h('p', { class: 'muted small' }, 'Категорий ещё нет.')
        );
      }
      fill(body,
        h('div', {
          class: 'lrow nav', onclick: () => finish({ catId: cat.id, subId: null })
        }, h('div', { class: 't' }, h('b', {}, cat.name), h('span', {}, 'без подкатегории'))),
        ...cat.subs.map(s => h('div', {
          class: 'lrow nav', onclick: () => finish({ catId: cat.id, subId: s.id })
        }, h('div', { class: 't' }, h('b', {}, s.name))))
      );
    }
    render(null);
  });
}

/**
 * Образ с архивной вещью на сегодня или вперёд — почти наверняка ошибка:
 * надеть проданное нельзя, а счётчик носок у архивной вещи вырастет на
 * носку, которой не было. На прошедший день не спрашиваем: тогда вещь ещё
 * была, и это самый частый законный случай.
 */
function askArchivedInDay(o, gone) {
  return new Promise(res => {
    let answered = false;
    const modal = openModal({
      title: 'В образе вещь из архива',
      body: h('div', {},
        h('p', { style: { margin: '2px 0 10px' } },
          `В образе «${o.name || 'Образ'}» ${goneText(gone).replace('из этого образа ', '')}.`),
        h('p', { class: 'muted small', style: { margin: '0 0 4px' } },
          'Если вы надели другую вещь вместо неё, соберите копию образа — иначе '
          + 'носка достанется той, что лежит в архиве.')),
      foot: [
        h('button', {
          class: 'btn primary', onclick: () => { answered = true; res('copy'); modal.close(); }
        }, '⧉ Собрать копию'),
        h('button', {
          class: 'btn quiet', onclick: () => { answered = true; res('keep'); modal.close(); }
        }, 'Всё равно добавить')
      ],
      onClose: () => { if (!answered) res(null); }
    });
  });
}

/* ---------- рендер вкладки ---------- */
const outfitTile = o => {
  const gone = archivedInOutfit(o).length;
  return h('div', {
    class: 'tile' + (gone ? ' has-gone' : ''), style: { background: bgCss(o.bg) },
    onclick: () => { nav.outfitId = o.id; emit(); }
  },
    h('img', { src: urlFor(o.preview) }),
    gone ? h('span', { class: 'gone-mark', title: 'В образе есть вещь из архива' }, '◷') : null,
    h('span', { class: 'lbl' }, o.name || 'Образ')
  );
};

function outfitGrid(root, list, emptyText) {
  fill(root,
    h('div', { class: 'row', style: { margin: '2px 0 8px' } },
      h('span', { class: 'small muted spacer' }, nOutfits(list.length))),
    list.length ? h('div', { class: 'grid g2' }, list.map(outfitTile)) : h('div', { class: 'empty' },
      h('div', { class: 'big' }, '👗'),
      h('p', {}, emptyText)),
    h('button', { class: 'fab', onclick: () => openOutfitEditor(null), title: 'Собрать образ' }, '+')
  );
  root.style.paddingBottom = '';
}

function renderOutfitRoot(root) {
  const cats = outfitCats().sort((a, b) => a.order - b.order);
  const loose = outfitsIn(OTHER, null).length;

  fill(root,
    h('div', { class: 'list' },
      navRow({
        thumbNode: collageThumb(state.outfits, o => o.preview), title: 'Все образы',
        note: nOutfits(state.outfits.length),
        onclick: () => { nav.all = true; emit(); }
      }),
      ...cats.map(c => navRow({
        thumbNode: previewOf(latestOutfit(c.id, null)), title: c.name,
        note: nOutfits(countInOutfitCat(c.id))
          + (c.subs.length ? ' · ' + plural(c.subs.length, 'подкатегория', 'подкатегории', 'подкатегорий') : ''),
        onclick: () => openCat(c.id)
      })),
      loose ? navRow({
        thumbNode: previewOf(latestOutfit(OTHER, null)), title: 'Другое', muted: true,
        note: nOutfits(loose) + ' без категории',
        onclick: () => openCat(OTHER)
      }) : null
    ),
    h('button', {
      class: 'btn block ghost', style: { marginTop: '14px' },
      onclick: () => openCategoryManager(outfitSpace)
    }, '⚙️ Категории образов'),
    h('button', { class: 'fab', onclick: () => openOutfitEditor(null), title: 'Собрать образ' }, '+')
  );
  root.style.paddingBottom = '';
}

function renderCat(root, cat) {
  const loose = outfitsIn(cat.id, OTHER).length;
  fill(root,
    h('div', { class: 'list' },
      ...cat.subs.map(s => navRow({
        thumbNode: previewOf(latestOutfit(cat.id, s.id)), title: s.name,
        note: nOutfits(outfitsIn(cat.id, s.id).length),
        onclick: () => { nav.subId = s.id; emit(); }
      })),
      loose ? navRow({
        thumbNode: previewOf(latestOutfit(cat.id, OTHER)), title: 'Другое', muted: true,
        note: nOutfits(loose) + ' без подкатегории',
        onclick: () => { nav.subId = OTHER; emit(); }
      }) : null
    ),
    h('button', { class: 'fab', onclick: () => openOutfitEditor(null), title: 'Собрать образ' }, '+')
  );
  root.style.paddingBottom = '';
}

function renderOutfits(root) {
  if (nav.outfitId) {
    const o = outfitById(nav.outfitId);
    if (o) return renderOutfitCard(root, o);
    nav.outfitId = null;
  }
  if (nav.all) return outfitGrid(root, state.outfits, 'Образов пока нет. Нажмите «+» внизу справа.');

  if (nav.catId === OTHER) {
    const loose = outfitsIn(OTHER, null);
    if (!loose.length) { nav.catId = null; return renderOutfitRoot(root); }
    return outfitGrid(root, loose, 'Здесь пусто.');
  }
  const cat = catOf(nav.catId);
  if (!cat) { nav.catId = null; nav.subId = null; return renderOutfitRoot(root); }

  if (!nav.subId) {
    return cat.subs.length
      ? renderCat(root, cat)
      : outfitGrid(root, outfitsIn(cat.id), `В категории «${cat.name}» пока пусто.`);
  }
  const list = outfitsIn(cat.id, nav.subId);
  if (nav.subId === OTHER && !list.length) { nav.subId = null; return renderCat(root, cat); }
  outfitGrid(root, list, 'Здесь пусто.');
}

/* ===== calendar.js ===== */
// Вкладка «Календарь»: какой образ надет в какой день. Только образы —
// отдельные вещи сюда не кладутся, иначе у счётчика носок два источника.
import {
  fill, h, urlFor, openModal, actionSheet, confirmDialog, iso, fmtDate, plural
} from './ui.js';

let cursor = new Date();
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль',
  'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

/**
 * Сверяет добавленные образы: нет ли в них вещей, ушедших в архив.
 * Спрашиваем только про сегодня и вперёд — см. askArchivedInDay.
 */
async function vetOutfits(dateStr, ids, before) {
  if (dateStr < iso(new Date())) return ids;        // строки «ГГГГ-ММ-ДД» сравниваются как даты
  const out = [...ids];
  for (const id of ids.filter(x => !before.includes(x))) {
    const o = outfitById(id);
    const gone = o ? archivedInOutfit(o) : [];
    if (!gone.length) continue;
    const act = await askArchivedInDay(o, gone);
    if (act === 'keep') continue;
    // и отказ, и сборка копии убирают исходный образ со дня
    out.splice(out.indexOf(id), 1);
    if (act !== 'copy') continue;
    const copy = await copyOutfit(o, gone.map(i => i.id));
    if (copy) out.push(copy.id);
  }
  return out;
}

function openDay(dateStr) {
  const day = dayByDate(dateStr) || { id: dateStr, outfitIds: [], itemIds: [] };
  const body = h('div', {});
  openModal({ title: fmtDate(dateStr), body, full: true });

  async function dropOutfit(id) {
    day.outfitIds = (day.outfitIds || []).filter(x => x !== id);
    await saveDay(day);
    render();
  }

  function render() {
    const outfits = (day.outfitIds || []).map(outfitById).filter(Boolean);
    // отдельные вещи в календарь больше не кладутся — только образы, иначе
    // у счётчика носок два источника. Но то, что уже записано, не прячем
    const legacy = (day.itemIds || []).map(itemById).filter(Boolean);

    fill(body,
      h('button', {
        // по одному: нажатие на образ и есть выбор. Несколько образов на день
        // бывают, но редко — ради них незачем просить «Готово» каждый раз
        class: 'btn primary block', onclick: async () => {
          const picked = await pickOutfits({ title: 'Выбрать образ', multi: false });
          if (!picked) return;
          const before = day.outfitIds || [];
          const ids = [...new Set([...before, ...picked])];
          day.outfitIds = await vetOutfits(dateStr, ids, before);
          await saveDay(day);
          render();
        }
      }, outfits.length ? '👗 Добавить образ' : '👗 Выбрать образ'),

      outfits.length ? h('div', { class: 'section-title' }, 'Надето') : null,
      outfits.length ? h('div', { class: 'grid g2' }, outfits.map(o => {
        const gone = archivedInOutfit(o).length;
        return h('div', {
          class: 'tile' + (gone ? ' has-gone' : ''), style: { background: bgCss(o.bg) },
          onclick: async () => {
            const act = await actionSheet(o.name || 'Образ', [
              { id: 'drop', icon: '✕', label: 'Убрать с этого дня' }
            ]);
            if (act === 'drop') dropOutfit(o.id);
          }
        },
          h('img', { src: urlFor(o.preview) }),
          gone ? h('span', { class: 'gone-mark', title: 'В образе есть вещь из архива' }, '◷') : null,
          h('span', { class: 'lbl' }, o.name || 'Образ'));
      })) : null,

      legacy.length ? h('div', { class: 'section-title' }, 'Вещи из старых записей') : null,
      legacy.length ? h('p', { class: 'muted small', style: { margin: '0 0 8px' } },
        'Отдельные вещи в календарь больше не добавляются — только образы.') : null,
      legacy.length ? h('div', { class: 'grid' }, legacy.map(it => h('div', {
        class: 'tile', style: { background: bgCss(it.bg) },
        onclick: async () => {
          if (!await confirmDialog('Убрать вещь с этого дня?', 'Убрать')) return;
          day.itemIds = (day.itemIds || []).filter(x => x !== it.id);
          await saveDay(day);
          render();
        }
      }, h('img', { src: urlFor(it.img) })))) : null,

      (!outfits.length && !legacy.length)
        ? h('div', { class: 'empty' },
          h('div', { class: 'big' }, '📅'),
          h('p', {}, 'На этот день ничего не отмечено.'))
        : null
    );
  }
  render();
}

function renderCalendar(root) {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y, m, 1);
  const startShift = (first.getDay() + 6) % 7;           // неделя с понедельника
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayIso = iso(new Date());

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const dayNum = i - startShift + 1;
    const date = new Date(y, m, dayNum);
    const ds = iso(date);
    const rec = dayByDate(ds);
    const outfit = rec?.outfitIds?.length ? outfitById(rec.outfitIds[0]) : null;
    const firstItem = !outfit && rec?.itemIds?.length ? itemById(rec.itemIds[0]) : null;
    const total = (rec?.outfitIds?.length || 0) + (rec?.itemIds?.length || 0);
    cells.push(h('div', {
      class: 'cal-cell' + (dayNum < 1 || dayNum > daysInMonth ? ' out' : '') + (ds === todayIso ? ' today' : ''),
      onclick: () => openDay(ds)
    },
      h('div', { class: 'd' }, date.getDate()),
      h('div', { class: 'pv' },
        outfit ? h('img', { src: urlFor(outfit.preview) })
          : firstItem ? h('img', { src: urlFor(firstItem.img) }) : null),
      total > 1 ? h('span', { class: 'n' }, total) : null
    ));
  }

  const prefix = `${y}-${String(m + 1).padStart(2, '0')}`;
  const monthDays = state.calendar.filter(d =>
    d.id.startsWith(prefix) && ((d.outfitIds?.length || 0) + (d.itemIds?.length || 0)));

  fill(root, 
    h('div', { class: 'row', style: { marginBottom: '10px' } },
      h('button', { class: 'btn btn-sm', onclick: () => { cursor = new Date(y, m - 1, 1); emit(); } }, '‹'),
      h('b', { class: 'spacer center', style: { textAlign: 'center' } }, `${MONTHS[m]} ${y}`),
      h('button', { class: 'btn btn-sm', onclick: () => { cursor = new Date(y, m + 1, 1); emit(); } }, '›')
    ),
    // одна строка вместо двух крупных цифр: счётчик носок живёт в карточке
    // вещи, где он что-то решает, а здесь важно только, что месяц не пуст
    h('p', { class: 'muted small center', style: { margin: '0 0 10px' } },
      monthDays.length
        ? plural(monthDays.length, 'день отмечен', 'дня отмечено', 'дней отмечено') + ' в этом месяце'
        : 'В этом месяце ничего не отмечено'),
    h('div', { class: 'cal-head' }, WD.map(d => h('div', {}, d))),
    h('div', { class: 'cal-grid' }, cells),
    h('button', { class: 'btn block', style: { marginTop: '12px' }, onclick: () => { cursor = new Date(); emit(); } }, 'Сегодня')
  );
}

/* ===== packing.js ===== */
// Вкладка «Чемодан»: список вещей на поездку с отметками «уложено».
// Поездка хранит только идентификаторы вещей — образы здесь не живут,
// кнопка «из Образа» просто разворачивает образ в его вещи.

const progress = t => ({
  total: t.itemIds?.length || 0,
  done: (t.itemIds || []).filter(id => t.checked?.[id]).length
});

/** Добавляет вещи, не трогая уже добавленные. Возвращает, сколько новых. */
async function addItems(trip, ids) {
  const have = new Set(trip.itemIds || []);
  const alive = ids.filter(id => itemById(id));
  const fresh = alive.filter(id => !have.has(id));
  if (!alive.length) { toast('Добавлять нечего'); return 0; }
  if (!fresh.length) { toast('Эти вещи уже в списке'); return 0; }
  trip.itemIds = [...(trip.itemIds || []), ...fresh];
  await saveTrip(trip);
  toast(fresh.length === alive.length
    ? `Добавлено ${fresh.length}`
    : `Добавлено ${fresh.length}, уже были ${alive.length - fresh.length}`);
  return fresh.length;
}

/** Выбор поездки, из которой копируются вещи (галочки не переносим). */
function pickTrip(exceptId) {
  return new Promise(res => {
    const list = byNewest(state.trips.filter(t => t.id !== exceptId));
    let done = false;
    const modal = openModal({
      title: 'Из какой поездки',
      body: list.length
        ? h('div', { class: 'list' }, list.map(t => h('button', {
          class: 'btn block', style: { textAlign: 'left' },
          onclick: () => { done = true; res(t); modal.close(); }
        }, `${t.done ? '📦 ' : ''}${t.name} · ${t.itemIds?.length || 0} вещей`)))
        : h('div', { class: 'empty' }, 'Других поездок пока нет'),
      onClose: () => { if (!done) res(null); }
    });
  });
}

function openTrip(trip) {
  const body = h('div', {});
  const modal = openModal({
    title: trip.name, body, full: true, onClose: emit,
    // действия над поездкой живут в шапке — иначе до них пришлось бы
    // прокручивать весь список вещей
    headAction: h('button', {
      class: 'icon-btn', title: 'Действия с поездкой',
      onclick: async () => {
        const act = await actionSheet(trip.name, [
          { id: 'arch', icon: trip.done ? '↩' : '📦', label: trip.done ? 'Вернуть из архива' : 'Переместить в архив' },
          { id: 'ren', icon: '✎', label: 'Переименовать' },
          { id: 'del', icon: '🗑', label: 'Удалить поездку', danger: true }
        ]);
        if (act === 'arch') {
          trip.done = !trip.done;
          await saveTrip(trip);
          toast(trip.done ? 'Перемещена в архив' : 'Возвращена в активные');
          render();
        } else if (act === 'ren') {
          const n = await promptDialog('Переименовать поездку', trip.name, 'Название');
          if (!n) return;
          trip.name = n;
          await saveTrip(trip);
          modal.root.querySelector('.modal-head h2').textContent = n;
        } else if (act === 'del') {
          if (await confirmDialog(`Удалить поездку «${trip.name}»? Вещи останутся в гардеробе.`)) {
            await deleteTrip(trip.id);
            modal.close();
          }
        }
      }
    }, '⋯')
  });

  function render() {
    const items = (trip.itemIds || []).map(itemById).filter(Boolean);
    const { total, done } = progress(trip);
    const gone = items.filter(i => i.archived).length;

    fill(body,
      // закреплено под шапкой: добавление доступно на любой длине списка
      h('div', { class: 'sticky-add' },
        h('div', { class: 'meta' },
          h('span', { class: 'section-title' }, 'Добавить вещи'),
          h('span', { class: 'trip-progress' },
            total ? `Уложено ${done} из ${total}` : 'Список пуст',
            gone ? ` · ${gone} из архива` : '',
            trip.done ? ' · в архиве' : '')
        ),
        h('div', { class: 'row', style: { gap: '8px' } },
          h('button', {
            class: 'btn btn-sm btn-add', style: { flex: '1' }, onclick: async () => {
              const ids = await pickItems({ title: 'Вещи в поездку', selected: trip.itemIds || [] });
              if (!ids) return;
              trip.itemIds = ids.filter(id => itemById(id));
              await saveTrip(trip);
              render();
            }
          }, '🧺 Гардероб'),
          h('button', {
            class: 'btn btn-sm btn-add', style: { flex: '1' }, onclick: async () => {
              const ids = await pickOutfits({ title: 'Развернуть образ в вещи' });
              if (!ids || !ids.length) return;
              // архивное берём: список для сборов — напоминание, а не опись
              // гардероба. Лишнее пользователь уберёт сам, а вот про шарф,
              // которого уже нет, лучше вспомнить до отъезда
              const fromOutfits = ids
                .flatMap(id => (outfitById(id)?.layers || []).map(l => l.itemId))
                .filter(id => itemById(id));
              await addItems(trip, [...new Set(fromOutfits)]);
              render();
            }
          }, '👗 Образ'),
          h('button', {
            class: 'btn btn-sm btn-add', style: { flex: '1' }, onclick: async () => {
              const src = await pickTrip(trip.id);
              if (!src) return;
              await addItems(trip, src.itemIds || []);
              render();
            }
          }, '🧳 Поездка')
        )
      ),

      h('div', { class: 'list' }, items.map(row)),
      items.length ? null : h('div', { class: 'empty' }, 'Добавьте вещи кнопками выше')
    );
  }

  function row(it) {
    const checked = !!trip.checked?.[it.id];
    // архивная вещь в списке — не ошибка, а подсказка: такую вещь надо
    // либо заменить, либо вычеркнуть. Поэтому помечаем, а не прячем
    return h('div', { class: 'lrow' + (it.archived ? ' gone' : ''), style: { opacity: checked ? .55 : 1 } },
      h('input', {
        type: 'checkbox', checked,
        style: { width: '22px', height: '22px', accentColor: 'var(--accent)', flex: '0 0 auto' },
        onchange: async e => {
          trip.checked = trip.checked || {};
          trip.checked[it.id] = e.target.checked;
          await saveTrip(trip);
          render();
        }
      }),
      h('img', { class: 'thumb', src: urlFor(it.img), style: { background: bgCss(it.bg) } }),
      h('div', { class: 't' },
        h('b', { style: { textDecoration: checked ? 'line-through' : '' } }, itemLabel(it)),
        it.archived ? h('span', {}, '◷ в архиве') : null),
      h('button', {
        class: 'btn btn-sm', title: 'Убрать из поездки',
        onclick: async () => {
          trip.itemIds = trip.itemIds.filter(x => x !== it.id);
          if (trip.checked) delete trip.checked[it.id];
          await saveTrip(trip);
          render();
        }
      }, '✕')
    );
  }

  render();
}

async function newTrip() {
  const name = await promptDialog('Новая поездка', '', 'Название, например «Лиссабон, май»');
  if (!name) return;
  const trip = { id: uid('tr'), name, itemIds: [], checked: {}, done: false, createdAt: Date.now() };
  await saveTrip(trip);
  openTrip(trip);
}

function tripRow(t) {
  const { total, done } = progress(t);
  return h('div', { class: 'lrow', onclick: () => openTrip(t) },
    h('div', { style: { fontSize: '26px', opacity: t.done ? .5 : 1 } }, '🧳'),
    h('div', { class: 't' },
      h('b', {}, t.name),
      h('span', {}, t.done ? `в архиве · ${total} вещей` : `уложено ${done} из ${total}`))
  );
}

function openArchive() {
  const body = h('div', {});
  const modal = openModal({ title: 'Архив поездок', body, full: true, onClose: emit });
  const render = () => {
    const archived = byNewest(state.trips.filter(t => t.done));
    fill(body, archived.length
      ? h('div', { class: 'list' }, archived.map(tripRow))
      : h('div', { class: 'empty' }, 'Архив пуст'));
  };
  render();
}

/**
 * Поездки — сверху новые. Дат у поездки нет, поэтому «новая» означает
 * «заведена позже». Сортируем при показе, а не полагаемся на то, в каком
 * порядке они оказались в памяти.
 */
const byNewest = list => [...list].sort((a, b) => b.createdAt - a.createdAt);

function renderPacking(root) {
  const active = byNewest(state.trips.filter(t => !t.done));
  const archived = byNewest(state.trips.filter(t => t.done));

  fill(root,
    active.length
      ? h('div', { class: 'list' }, active.map(tripRow))
      : h('div', { class: 'empty' },
        h('div', { class: 'big' }, '🧳'),
        h('p', {}, archived.length
          ? 'Активных поездок нет — все лежат в архиве.'
          : 'Поездок пока нет. Чтобы собрать чемодан, нажмите «+» внизу справа.')),

    // архив всегда на одном месте — закреплён над панелью вкладок
    archived.length ? h('div', { class: 'archive-bar', onclick: openArchive },
      h('span', {}, '📦'),
      h('b', { class: 'spacer' }, 'Архив поездок'),
      h('span', { class: 'muted' }, archived.length),
      h('span', { class: 'muted' }, '›')
    ) : null,

    h('button', { class: 'fab' + (archived.length ? ' raised' : ''), onclick: newTrip }, '+')
  );

  root.style.paddingBottom = archived.length ? '140px' : '';
}

/* ===== settings.js ===== */
// Настройки: резервная копия — экспорт и импорт всего гардероба одним JSON.
// В приложении это Google Drive; в прототипе — обычный файл, логика та же.

const BLOB_FIELDS = { items: ['img'], outfits: ['preview'] };

const blobToDataURL = b => new Promise(res => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.readAsDataURL(b);
});
const dataURLToBlob = url => fetch(url).then(r => r.blob());

async function exportAll() {
  busy(true, 'Готовлю резервную копию…');
  const dump = { version: 1, createdAt: new Date().toISOString(), stores: {} };
  for (const s of STORES) {
    const rows = await dbAll(s);
    const fields = BLOB_FIELDS[s] || [];
    dump.stores[s] = await Promise.all(rows.map(async r => {
      const copy = { ...r };
      for (const f of fields) if (copy[f] instanceof Blob) copy[f] = await blobToDataURL(copy[f]);
      return copy;
    }));
  }
  const filename = `yourcloset-backup-${new Date().toISOString().slice(0, 10)}.json`;
  busy(false);
  const downloads = typeof window.claude?.use === 'function' ? await window.claude.use('downloads') : null;
  if (!downloads) { toast('Сохранение файла недоступно в этом просмотре', 3200); return; }
  try {
    await downloads.save({ filename, data: JSON.stringify(dump) });
    toast('Копия сохранена');
  } catch (e) {
    if (e && e.code !== 'declined') toast('Не удалось сохранить копию', 3200);
  }
}

async function importAll(file) {
  busy(true, 'Восстанавливаю…');
  try {
    const dump = JSON.parse(await file.text());
    if (!dump.stores) throw new Error('bad format');
    for (const s of STORES) {
      await dbClear(s);
      const fields = BLOB_FIELDS[s] || [];
      for (const row of dump.stores[s] || []) {
        const copy = { ...row };
        for (const f of fields) if (typeof copy[f] === 'string' && copy[f].startsWith('data:')) copy[f] = await dataURLToBlob(copy[f]);
        await dbPut(s, copy);
      }
    }
    await loadAll();
    emit();
    toast('Данные восстановлены');
  } catch (e) {
    console.error(e);
    toast('Не удалось прочитать файл');
  } finally { busy(false); }
}

function openSettings() {
  const fileInput = h('input', {
    type: 'file', accept: 'application/json', style: { display: 'none' },
    onchange: e => { const f = e.target.files[0]; if (f) importAll(f); e.target.value = ''; }
  });

  openModal({
    title: 'Настройки',
    body: h('div', {},
      // в гардероб не входят служебные категории: «Сортировка» ещё не разобрана,
      // а «На рассмотрении» — то, что пока не куплено
      h('div', { class: 'stat-row' },
        h('div', { class: 'stat' }, h('b', {}, closetCount()),
          h('span', {}, pluralWord(closetCount(), 'вещь', 'вещи', 'вещей'))),
        h('div', { class: 'stat' }, h('b', {}, state.outfits.length),
          h('span', {}, pluralWord(state.outfits.length, 'образ', 'образа', 'образов'))),
        h('div', { class: 'stat' }, h('b', {}, state.trips.length),
          h('span', {}, pluralWord(state.trips.length, 'поездка', 'поездки', 'поездок')))),
      h('p', { class: 'muted small center', style: { margin: '8px 0 0' } },
        `на рассмотрении ${countInSystem('review')} · не разобрано ${countInSystem('sorting')} · в архиве ${archivedItems().length}`),
      h('div', { class: 'section-title' }, 'Резервная копия'),
      h('div', { class: 'list' },
        h('button', { class: 'btn block', onclick: exportAll }, '⬇️ Сохранить копию в файл'),
        h('button', { class: 'btn block', onclick: () => fileInput.click() }, '⬆️ Восстановить из файла'),
        fileInput),
      h('p', { class: 'muted small', style: { marginTop: '16px' } },
        'Веб-демо: ИИ-вырезание фона и камера недоступны, остальное работает целиком. Данные лежат только в вашем браузере (IndexedDB) — для переноса делайте копию.')
    )
  });
}

/* ===== app.js ===== */
// Точка входа: загрузка состояния, переключение вкладок, перерисовка.

const TABS = {
  closet: { title: 'Гардероб', render: renderCloset, nav: closetNav },
  outfits: { title: 'Образы', render: renderOutfits, nav: outfitsNav },
  calendar: { title: 'Календарь', render: renderCalendar },
  packing: { title: 'Чемодан', render: renderPacking }
};

let current = 'closet';

function renderTopbar() {
  // вкладка может быть вложенной (гардероб ходит по категориям) —
  // тогда она сама говорит, что написать в заголовке и куда ведёт «назад»
  const inner = TABS[current].nav?.() || null;
  qs('#tb-title').textContent = inner?.title || TABS[current].title;

  const back = qs('#tb-back');
  back.hidden = !inner?.back;
  back.onclick = inner?.back || null;

  const actions = qs('#tb-actions');
  fill(actions,
    inner?.action
      ? h('button', {
        class: 'icon-btn', title: inner.action.title, onclick: inner.action.onclick
      }, inner.action.icon)
      : null,
    h('button', { class: 'icon-btn', title: 'Настройки', onclick: openSettings }, '⚙️')
  );
}

function render() {
  for (const key of Object.keys(TABS)) {
    const el = qs('#view-' + key);
    el.hidden = key !== current;
  }
  const root = qs('#view-' + current);
  TABS[current].render(root);
  renderTopbar();
}

function setTab(tab) {
  current = tab;
  qsa('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  qs('main#views').scrollTop = 0;
  render();
}

async function boot() {
  await loadAll();
  subscribe(() => render());
  qsa('#tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  render();
  // загрузка могла что-то поправить сама — не молчим об этом
  notices.forEach((msg, i) => setTimeout(() => toast(msg, 4200), 600 + i * 800));
}

boot().catch(e => {
  console.error(e);
  document.body.innerHTML = '<p style="padding:24px">Ошибка запуска: ' + e.message + '</p>';
});
</script>
